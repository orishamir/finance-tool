<!doctype html>
<html lang="he" dir="rtl">

<style>

    --c-fund: oklch(0.86 0.13 92); --c-buy: oklch(0.70 0.17 50); --c-cust: oklch(0.80 0.12 60); --c-acct: oklch(0.58 0.15 45); --c-tax: var(--chart-tax); --c-left: var(--palette-teal-500);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--background); color: var(--foreground); font-family: "Inter Variable", "Heebo Variable", sans-serif; font-size: 16px; line-height: 1.6; }

  .tag.best { color: var(--best); } .tag.you { color: var(--you); }

  /* labels: icon + colour per family */
  .labs { display: flex; flex-wrap: wrap; gap: 5px; }
  .lab { --c: var(--muted-foreground); display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; line-height: 22px; padding: 0 9px 0 8px; border-radius: 999px; white-space: nowrap;
         color: var(--c); background: color-mix(in oklch, var(--c) 13%, transparent); border: 1px solid color-mix(in oklch, var(--c) 40%, transparent); }
  .lab svg { width: 14px; height: 14px; flex: none; }
  .lab.trade { --c: var(--l-trade); } .lab.follow { --c: var(--l-follow); } .lab.payout { --c: var(--l-payout); } .lab.currency { --c: var(--l-currency); }
  .lab.tax { --c: var(--l-tax); } .lab.order { --c: var(--l-order); } .lab.asks { --c: var(--l-asks); } .lab.open { --c: var(--l-open); }

  /* summary strip */
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border: 1px solid var(--border); border-radius: 14px; background: var(--card); }
  .stat { padding: 14px 18px; display: flex; flex-direction: column; gap: 2px; border-inline-start: 1px solid var(--border); }
  .stat:first-child { border-inline-start: 0; }
  .stat .k { font-size: 13px; color: var(--muted-foreground); }

  .ul { text-decoration: underline dotted var(--computed); text-underline-offset: 5px; text-decoration-thickness: 2px; }

  /* layout: list beside detail */
  .side { display: grid; grid-template-columns: 410px minmax(0, 1fr); gap: 24px; align-items: start; }
  .side.wide { grid-template-columns: minmax(0, 1fr) 470px; }

  /* stacked bars, one above the other on one scale */

  .stack > i:last-child { border: 0; }
  .f-fund { background: var(--c-fund); } .f-buy { background: var(--c-buy); } .f-cust { background: var(--c-cust); } .f-acct { background: var(--c-acct); } .f-tax { background: var(--c-tax); } .f-left { background: var(--c-left); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted-foreground); }

  .scale { display: grid; grid-template-columns: 120px minmax(0, 1fr) 84px; gap: 12px; font-size: 12px; color: var(--muted-foreground); }

  .sb-list .scale { grid-template-columns: 22px 110px minmax(0, 1fr) 70px 76px; padding: 0 8px; }

  /* funds */

  .group-h { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0 2px; font-size: 13.5px; color: var(--palette-teal-200); font-weight: 600; }

  .steps { margin: 0; padding-inline-start: 22px; display: flex; flex-direction: column; gap: 6px; }
  .note { font-size: 13px; color: var(--muted-foreground); }
  .callout { border-inline-start: 4px solid var(--primary); background: var(--popover); border-radius: 8px; padding: 10px 14px; font-size: 15px; }
  table.fees { border-collapse: collapse; width: 100%; font-size: 14.5px; table-layout: fixed; }
  table.fees col.c { width: 130px; }
  table.fees th, table.fees td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
  table.fees th { font-size: 13px; color: var(--muted-foreground); font-weight: 500; }
  table.fees td.n, table.fees th.n { text-align: center; }

  table.fees .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-inline-end: 8px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
</style>

<body>
<style>

<script>
const ST = new URLSearchParams(location.search).get("st") || "F1";
const n = (x) => Math.round(x).toLocaleString("he-IL");
const GAP = (x) => `<span class="num">−${n(x)} ₪</span>`;
const I = {
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', cal: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/>',
  swap: '<path d="M7 4 3 8l4 4"/><path d="M3 8h14"/><path d="m17 20 4-4-4-4"/><path d="M21 16H7"/>', mixed: '<path d="M3 7h4l10 10h4"/><path d="M3 17h4l3-3"/><path d="M14 10l3-3h4"/><path d="m18 4 3 3-3 3"/><path d="m18 14 3 3-3 3"/>',
  grow: '<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>', dollar: '<circle cx="12" cy="12" r="9"/><path d="M15 9.5c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .9-3 2s1.3 1.7 3 2 3 .9 3 2-1.3 2-3 2c-1.4 0-2.5-.5-3-1.5M12 6v2M12 16v2"/>',
  shield: '<path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6l8-3z"/>', percent: '<path d="M19 5 5 19"/><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/>',
};
const L = (fam, icon, text) => `<span class="lab ${fam}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[icon]}</svg>${text}</span>`;
const typeLab = (t) => t === "m" ? L("trade", "cal", "קרן מחקה · פעם ביום") : L("trade", "clock", "קרן סל · כל היום");
const followLab = (f) => f === "swap" ? L("follow", "swap", "עסקת החלף") : L("follow", "mixed", "כמה דרכים יחד");

/* live 27.10.2026: [account, left with Yalin tracking fund (null: the tariff has no line for mutual-fund units), left with ATF ETF] */
const A = [["פסגות",78943,78252],["לאומי",76322,73036],["ירושלים",null,75675],["וואן זירו",null,75181],["הפועלים",null,73740],["יהב",null,73740],["דיסקונט",null,72330],["מרכנתיל",null,72330],["אי.בי.אי",71647,71126],["מסד",null,71249],["הבינלאומי",null,70859],["מזרחי טפחות",null,70304],["אלטשולר טרייד",59242,58698],["אקסלנס",null,57710]];
/* F3 only: what the 10 missing values might be once researched, made up for the picture */
const FUTURE = { "ירושלים": 76010, "וואן זירו": 74420, "הפועלים": 74890, "יהב": 73950, "דיסקונט": 72110, "מרכנתיל": 72110, "מסד": 71830, "הבינלאומי": 71540, "מזרחי טפחות": 70120, "אקסלנס": 58300 };
const YOU = "לאומי";
const FUNDS = [["ילין לפידות מחקה (4D) S&P 500","5139282","m","swap",0,78943],["אלטשולר שחם מחקה (4D) S&P 500","5139100","m","mixed",0,78906],["קסם S&P 500 (4D) KTF","5124482","m","mixed",0,78556],["הראל מחקה (4D) S&P 500","5129275","m","mixed",0,78556],["ATF סל (4D) S&P 500","1218916","e","mixed",0,78252],["הראל מחקה (4A) S&P 500 - מנוטרלת מט״ח","5127527","m","mixed",1,77845],["ילין לפידות סל (4D) S&P 500","1201656","e","swap",0,77845],["מור סל (4D) S&P 500","1165810","e","swap",0,77484],["MTF סל (4D) S&P 500","1150333","e","swap",0,76913]];

/* illustrative: what the account charges, split by fee type */
function charges(name, left, top, base) {
  const tot = base + 1.25 * (top - left);
  if (name === "פסגות") return { buy: base * 0.6, cust: base * 0.4, acct: 0 };
  return tot > 20000 ? { buy: tot * 0.3, cust: tot * 0.3, acct: tot * 0.4 } : { buy: tot * 0.45, cust: tot * 0.5, acct: tot * 0.05 };
}
const sum = (c) => c.buy + c.cust + c.acct;
const MAXCH = 28000;
const bar = (c) => `<div class="stack" style="height:14px;width:${(sum(c) / MAXCH) * 100}%"><i class="f-buy" style="width:${(c.buy / sum(c)) * 100}%"></i><i class="f-cust" style="width:${(c.cust / sum(c)) * 100}%"></i>${c.acct ? `<i class="f-acct" style="width:${(c.acct / sum(c)) * 100}%"></i>` : ""}</div>`;
const legend = `<div class="legend"><span><i class="f-buy"></i>עמלות קנייה</span><span><i class="f-cust"></i>דמי משמרת</span><span><i class="f-acct"></i>דמי ניהול חשבון</span></div>`;

function header() {
  const what = ST === "F3" ? "מצב עתידי: כל התעריפונים נחקרו. הערכים של עשרת החשבונות שחסרים היום הומצאו לתמונה" : ST === "F2" ? "היום, אחרי שבחרו קרן סל ברשימת הקרנות" : "היום, כשהעמוד נפתח";
  return `<div class="sketch">סקיצה לדיון · ${what} · לא אינטראקטיבית · "נשאר" מהאתר החי (27.10.2026); מה שהחשבון גובה, לפי סוג עמלה: להמחשה</div>
  <div class="topbar"><span class="brand">מקור</span><nav class="menu"><span>מדריך</span><span>שאלות שכולם שואלים</span><span>חברות ומסלולים</span><span>השוואה למטרה</span><b>השקעה במדד</b></nav></div>`;
}
function intro() {
  const idx = ["MSCI AC World", "MSCI World", "נאסד״ק 100", "S&P 500", "ת״א-125", "ת״א-35", "ת״א-90", "+ אחר"];
  return `<header style="display:flex;flex-direction:column;gap:12px">
    <div><h1>השקעה במדד</h1><p class="sub">כבר בחרתם מדד. כאן: איפה לפתוח חשבון ניירות ערך, ומה לקנות בו.</p></div>
    <div class="row">${idx.map((x) => `<span class="chip ${x === "S&P 500" ? "on" : ""}">${x}</span>`).join("")}</div>
    <div class="row"><span class="pc"><span class="k">סכום</span><span class="v num">10,000 ₪</span></span><span class="pc"><span class="k">כל חודש</span><span class="v num">500 ₪</span></span><span class="pc"><span class="k">תקופה</span><span class="v">10 שנים</span></span><span class="pc mine"><span class="k">החשבון שלכם</span><span class="v">${YOU}</span></span><span class="link small">עוד הנחות</span></div>
  </header>`;
}

function page() {
  const etf = ST === "F2", fund = etf ? FUNDS[4] : FUNDS[0];
  const val = (a) => etf ? a[2] : a[1] ?? (ST === "F3" ? FUTURE[a[0]] : null);
  const priced = A.filter((a) => val(a) != null).sort((x, y) => val(y) - val(x));
  const missing = A.filter((a) => val(a) == null);
  const top = val(priced[0]), base = etf ? 560 : 500;
  const you = A.find((a) => a[0] === YOU), youGap = top - val(you);
  const best = !etf;
  return `${intro()}
  <div class="stats" style="grid-template-columns:1.4fr 1fr 1fr 1fr">
    <div class="stat"><span class="k">${best ? "הדרך הזולה ביותר לתוכנית שלכם" : "הבחירה שלכם"}</span><span style="font-size:18px;font-weight:700;line-height:1.35">פסגות · <bdi>${fund[0]}</bdi></span><span class="n">${best ? "החשבון והקרן שנשאר בהם הכי הרבה" : `<span class="link">חזרה לדרך הזולה ביותר</span> · נשאר בה <span class="num">691 ₪</span> יותר`}</span></div>
    <div class="stat"><span class="k">נשאר בעוד 10 שנים</span><span class="v num ul">${n(top)} ₪</span><span class="n">אחרי דמי ניהול ומס, בכסף של היום</span></div>
    <div class="stat"><span class="k">מה פסגות גובה</span><span class="v num ul">${n(base)} ₪</span><span class="n">עמלות ודמי משמרת, ב־10 שנים</span></div>
    <div class="stat"><span class="k">לעומת ${YOU}, החשבון שלכם</span><span class="v num ul" style="color:var(--best)">+${n(youGap)} ₪</span><span class="n">על אותה קרן</span></div>
  </div>
  <div class="side wide">
    <section style="display:flex;flex-direction:column;gap:8px">
      <h2>איפה לפתוח את החשבון</h2>
      <div class="ctx"><span class="muted">כל החשבונות, כשקונים בהם את</span><span class="pick"><bdi>${fund[0]}</bdi></span><span class="muted small">· בחרו קרן אחרת ברשימה שמשמאל</span></div>
      <div class="tbl-h" style="margin-top:6px"><span>#</span><span>חשבון</span><span>מה החשבון גובה ב־10 שנים</span><span class="r" style="text-align:left">נשאר</span><span style="text-align:left">פחות מהזול</span></div>
      ${priced.map((a, i) => { const v = val(a), c = charges(a[0], v, top, base), g = top - v;
        return `<div class="tr ${a[0] === "פסגות" ? "sel" : ""} ${a[0] === YOU ? "you" : ""}"><span class="rk">${i + 1}</span><span class="nm">${a[0]}${a[0] === YOU ? "<small>החשבון שלכם</small>" : ""}</span>
        <span class="barcell">${bar(c)}<span class="amt num">${n(sum(c))} ₪</span></span><span class="r num">${n(v)} ₪</span><span class="r">${g ? GAP(g) : `<span style="color:var(--best);font-weight:600">הזול</span>`}</span></div>`; }).join("")}
      <div style="padding:8px 10px">${legend}</div>
      ${missing.length ? `<div class="na-h"><span><b>${missing.length} חשבונות שאי אפשר לחשב עם הקרן הזו</b> · בתעריפון שלהם אין שורה ליחידות של קרן נאמנות. זה בבדיקה.</span><span class="link small">איך נאסף התעריפון</span></div>
        ${missing.map((a) => `<div class="tr na"><span class="rk">—</span><span class="nm">${a[0]}</span><span class="why">אפשר לחשב אותו עם קרן סל: <span class="link">ATF סל (4D) S&P 500</span>, נשאר <span class="num">${n(a[2])} ₪</span></span></div>`).join("")}` : ""}
      ${ST === "F3" ? `<div class="future">כשהתעריפונים ייחקרו, אותן שורות פשוט מצטרפות לדירוג. אין שינוי בעיצוב.</div>` : ""}
      <span class="note" style="padding:0 10px">מיטב טרייד: התעריפון לא נאסף.</span>
    </section>
    <div class="card" style="display:flex;flex-direction:column;gap:12px">
      <h2>מה קונים</h2>
      <div class="ctx"><span class="muted">כל הקרנות על S&P 500, בחשבון</span><span class="pick">פסגות</span></div>
      <div class="fbar"><span class="k">סננו:</span>${L("trade", "cal", 'קרן מחקה <span class="cnt num">5</span>')}${L("trade", "clock", 'קרן סל <span class="cnt num">8</span>')}${L("follow", "swap", 'עסקת החלף <span class="cnt num">5</span>')}${L("currency", "shield", 'מנוטרלת מט״ח <span class="cnt num">1</span>')}</div>
      <div>${FUNDS.map((f, i) => `<div class="frow3 ${f === fund ? "sel" : ""}"><span class="rad"></span><span class="t"><b><bdi>${f[0]}</bdi></b><a class="num">${f[1]} ↗</a></span><span class="v num">${n(f[5])} ₪</span>
        <span></span><span class="labs">${typeLab(f[2])}${followLab(f[3])}${f[4] ? L("currency", "shield", "מנוטרלת מט״ח") : L("currency", "dollar", "חשיפה לדולר")}${i < 4 ? `<span class="tag best" style="align-self:center">שוות לתוכנית שלכם</span>` : ""}</span></div>`).join("")}</div>
      <span class="link small">עוד 4 קרנות</span>
      <span class="note">13 קרנות על המדד עם רשומה באתר; הרשימה המלאה ב־Maya ↗. הפרש העקיבה עוד לא נאסף, ונלקח כאפס.</span>
    </div>
  </div>`;
}
document.getElementById("root").innerHTML = header() + `<main class="wrap">${page()}</main>`;
</script>
</body>
</html>
