const legend = `<div class="legend" style="padding:8px 16px"><span><i class="f-buy"></i>עמלות קנייה</span><span><i class="f-cust"></i>דמי משמרת</span><span><i class="f-acct"></i>דמי ניהול חשבון</span></div>`;

function header() {
  const what = { G1: "G1 · שני חריצים מעל שתי הרשימות", G2: "G2 · הרשימות מראות מה ישתנה אם מחליפים רק את זה", G3: "G3 · מה קורה כשבוחרים את החשבון שלכם" }[ST];
  return `<div class="sketch">סקיצה לדיון · ${what} · לא אינטראקטיבית · "נשאר" מהאתר החי (27.10.2026); מה שהחשבון גובה: להמחשה</div>
  <div class="topbar"><span class="brand">מקור</span><nav class="menu"><span>מדריך</span><span>שאלות שכולם שואלים</span><span>חברות ומסלולים</span><span>השוואה למטרה</span><b>השקעה במדד</b></nav></div>`;
}
function intro() {
  const idx = ["MSCI AC World", "MSCI World", "נאסד״ק 100", "S&P 500", "ת״א-125", "ת״א-35", "ת״א-90", "+ אחר"];
  return `<header style="display:flex;flex-direction:column;gap:12px">
    <div><h1>השקעה במדד</h1><p class="sub">כבר בחרתם מדד. בוחרים חשבון ניירות ערך וקרן, ורואים כמה יישאר לכם.</p></div>
    <div class="row">${idx.map((x) => `<span class="chip ${x === "S&P 500" ? "on" : ""}">${x}</span>`).join("")}</div>
    <div class="row"><span class="pc"><span class="k">סכום</span><span class="v num">10,000 ₪</span></span><span class="pc"><span class="k">כל חודש</span><span class="v num">500 ₪</span></span><span class="pc"><span class="k">תקופה</span><span class="v">10 שנים</span></span><span class="pc mine"><span class="k">החשבון שלכם</span><span class="v">${YOU}</span></span><span class="link small">עוד הנחות</span></div>
  </header>`;
}

function page() {
  const acc = ST === "G3" ? YOU : "פסגות", fund = FUNDS[0], fi = acc === YOU ? 1 : 0;
  const left = fund[5][fi], delta = ST === "G2";
  const result = ST === "G3"
    ? `<div class="result" style="grid-template-columns:minmax(0,1fr)"><div class="cmp">
        <div class="cmpc yours on"><span class="h">הבחירה שלכם · החשבון שלכם</span><span class="p">${refAcc(YOU)} + ${refFund(fund[0])}</span><span class="v num">${n(76322)} ₪</span><span class="small muted">נשאר בעוד 10 שנים, אחרי דמי ניהול ומס, בכסף של היום</span></div>
        <div class="cmpc"><span class="h">הזוג הזול ביותר</span><span class="p">${refAcc("פסגות")} + ${refFund(fund[0])}</span><span class="v num" style="color:var(--best)">${n(BEST)} ₪ <span class="small" style="font-weight:500">· +${n(BEST - 76322)} ₪ אם עוברים לפסגות</span></span><span class="small link">בחרו את הזוג הזה</span></div>
      </div></div>`
    : `<div class="result"><div><span class="muted small">נשאר לכם בעוד 10 שנים</span><div class="big num ul">${n(left)} ₪</div></div>
        <div class="vs"><span class="muted small">אחרי דמי ניהול ומס, בכסף של היום</span><span><span class="star">★ הזוג הזול ביותר לתוכנית שלכם</span></span></div>
        <div class="vs" style="text-align:left"><span class="muted small">לעומת ${YOU}, החשבון שלכם, עם אותה קרן</span><span class="num" style="font-size:22px;font-weight:700;color:var(--best)">+${n(BEST - 76322)} ₪</span></div></div>`;

  const priced = ACCS.filter((a) => YALIN[a] != null).sort((x, y) => YALIN[y] - YALIN[x]);
  const missing = ACCS.filter((a) => YALIN[a] == null);
  const accRows = priced.map((a, i) => { const v = YALIN[a], c = charges(a, v);
    return `<div class="arow ${a === acc ? "sel" : ""} ${a === YOU ? "you" : ""}"><span class="rad"></span><span class="rk">${i + 1}</span>
      <span class="nm">${a}${a === YOU ? "<small>החשבון שלכם</small>" : a === "פסגות" && acc !== "פסגות" ? `<small class="star">★ הזול</small>` : ""}</span>
      <span class="barcell">${bar(c)}<span class="amt num">${n(sum(c))} ₪</span></span>
      <span class="r">${delta ? D(v - left) : `<span class="num" style="font-weight:600">${n(v)} ₪</span>`}</span></div>`; }).join("");
  const fundRows = (list) => list.map((f) => { const v = f[5][fi];
    return `<div class="frow ${f === fund ? "sel" : ""}"><span class="rad"></span><span class="t"><b><bdi>${f[0]}</bdi></b><a class="num">${f[1]} ↗</a></span>
      <span class="v">${delta ? D(v - left) : `<span class="num">${n(v)} ₪</span>`}</span>
      <span></span><span class="labs">${typeLab(f[2])}${followLab(f[3])}${f[4] ? L("currency", "shield", "מנוטרלת מט״ח") : L("currency", "dollar", "חשיפה לדולר")}</span></div>`; }).join("");
  const tracking = FUNDS.filter((f) => f[2] === "m"), etfs = FUNDS.filter((f) => f[2] === "e");
  const fundsSorted = [...FUNDS].sort((a, b) => b[5][fi] - a[5][fi]);
  const fundList = ST === "G3"
    ? `${fundRows(tracking)}<div class="sep">קרנות סל: בלאומי נשאר בהן לפחות <span class="num">3,286 ₪</span> פחות</div>${fundRows(etfs)}`
    : fundRows(fundsSorted);

  const accFacts = acc === "פסגות" ? `<span>גובה <span class="num">500 ₪</span> ב־10 שנים, על הקרן הזו</span><span>בפיקוח רשות ני״ע</span><a>איך פותחים</a>` : `<span>גובה <span class="num">3,776 ₪</span> ב־10 שנים, על הקרן הזו</span><span>בפיקוח רשות ני״ע</span><a>איך עוברים</a>`;
  return `${intro()}${result}
  <div class="pair">
    <div class="col">
      <div class="slot"><span class="k">${svg("bank")}חשבון ניירות ערך</span><span class="name">${acc === "פסגות" ? "פסגות ניירות ערך (פסגות טרייד)" : "בנק לאומי"}</span><span class="facts">${accFacts}</span></div>
      <div class="listh"><b>${delta ? "אם מחליפים רק את החשבון" : "כל החשבונות"}</b><span class="cond">כשקונים בהם את ${refFund(fund[0])} · בחרו קרן אחרת, והרשימה תסתדר מחדש</span></div>
      <div class="ahead"><span></span><span>#</span><span>חשבון</span><span>מה החשבון גובה ב־10 שנים</span><span class="r">${delta ? "ההפרש" : "נשאר"}</span></div>
      ${accRows}
      ${legend}
      <div class="na"><b>${missing.length} חשבונות לא מחושבים עם הקרן הזו:</b> בתעריפון שלהם אין שורה ליחידות של קרן נאמנות. כשזה ייאסף, הם יצטרפו לרשימה.</div>
      <div style="padding:2px 16px 14px;font-size:13.5px;color:var(--muted-foreground)">${missing.join(" · ")}</div>
    </div>
    <div class="plus"><span>+</span></div>
    <div class="col">
      <div class="slot"><span class="k">${svg("pie")}קרן</span><span class="name" style="font-size:19px"><bdi>${fund[0]}</bdi></span><span class="facts"><a class="num">${fund[1]} ↗</a><span>דמי ניהול <span class="num">0% · 0% · 0.02%</span></span></span></div>
      <div class="listh"><b>${delta ? "אם מחליפים רק את הקרן" : "כל הקרנות על S&P 500"}</b><span class="cond">בחשבון ${refAcc(acc)} · בחרו חשבון אחר, והרשימה תסתדר מחדש</span></div>
      <div class="fbar"><span class="k">סננו:</span>${L("trade", "cal", 'קרן מחקה <span class="cnt num">5</span>')}${L("trade", "clock", 'קרן סל <span class="cnt num">8</span>')}${L("follow", "swap", 'עסקת החלף <span class="cnt num">5</span>')}${L("currency", "shield", 'מנוטרלת מט״ח <span class="cnt num">1</span>')}</div>
      ${fundList}
      <div style="padding:10px 16px;display:flex;flex-direction:column;gap:6px"><span class="link small">עוד 5 קרנות</span><span class="note">13 קרנות על המדד עם רשומה באתר; הרשימה המלאה ב־Maya ↗. הפרש העקיבה עוד לא נאסף, ונלקח כאפס.</span></div>
    </div>
  </div>
  <section class="card" style="display:flex;flex-direction:column;gap:8px"><h2>מה עושים עכשיו</h2><ol class="steps"><li>${acc === "פסגות" ? "פותחים חשבון בפסגות" : "החשבון בלאומי כבר קיים"}</li><li>קונים את <bdi>${fund[0]}</bdi> לפי מספר הנייר <span class="num link">${fund[1]}</span></li><li>קובעים הוראת קבע של <span class="num">500 ₪</span> בחודש</li></ol></section>`;
}
document.getElementById("root").innerHTML = header() + `<main class="wrap">${page()}</main>`;
</script>
</body>
</html>
