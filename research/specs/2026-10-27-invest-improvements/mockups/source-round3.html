/* illustrative: what the account itself charges (buying, custody, account fee); the engine does not split it yet */

  const ps = t === "m" ? 78943 : 78252, tot = (t === "m" ? 500 : 560) + 1.25 * (ps - left);

function header() {
  return `<div class="sketch">סקיצה לדיון · אפשרות ${OPT} · לא אינטראקטיבית · "נשאר" מהאתר החי (27.10.2026) · מה שהחשבון גובה, לפי סוג עמלה: להמחשה בלבד · כל תווית נפתחת בלחיצה</div>
  <div class="topbar"><span class="brand">מקור</span><nav class="menu"><span>מדריך</span><span>שאלות שכולם שואלים</span><span>חברות ומסלולים</span><span>השוואה למטרה</span><b>השקעה במדד</b></nav></div>`;
}
function intro() {
  const idx = ["MSCI AC World", "MSCI World", "נאסד״ק 100", "S&P 500", "ת״א-125", "ת״א-35", "ת״א-90", "+ אחר"];
  return `<header style="display:flex;flex-direction:column;gap:12px">
    <div><h1>השקעה במדד</h1><p class="sub">כבר בחרתם מדד. כאן: איפה לפתוח חשבון ניירות ערך, ומה לקנות בו.</p></div>
    <div class="row">${idx.map((x) => `<span class="chip ${x === "S&P 500" ? "on" : ""}">${x}</span>`).join("")}</div>
    <div class="row"><span class="pc"><span class="k">סכום</span><span class="v num">10,000 ₪</span></span><span class="pc"><span class="k">כל חודש</span><span class="v num">500 ₪</span></span><span class="pc"><span class="k">תקופה</span><span class="v">10 שנים</span></span><span class="pc mine"><span class="k">החשבון שלכם</span><span class="v">${YOU}</span></span><span class="link small">עוד הנחות</span></div>
  </header>`;
}
function stats(left, ch, vsYou) {
  return `<div class="stats" style="grid-template-columns:repeat(3,minmax(0,1fr))">
    <div class="stat"><span class="k">נשאר בפסגות, בעוד 10 שנים</span><span class="v num ul">${n(left)} ₪</span><span class="n">אחרי דמי ניהול ומס, בכסף של היום</span></div>
    <div class="stat"><span class="k">מה פסגות גובה</span><span class="v num ul">${n(ch)} ₪</span><span class="n">עמלות קנייה ודמי משמרת, לאורך 10 שנים</span></div>
    <div class="stat"><span class="k">לעומת ${YOU}, החשבון שלכם</span><span class="v num ul" style="color:var(--best)">+${n(vsYou)} ₪</span><span class="n">יותר נשאר לכם בפסגות</span></div>
  </div>`;
}
function fundRow(f) {
  return `<div class="frow2"><span class="t"><b><bdi>${f[0]}</bdi></b><a class="num">${f[1]} ↗</a></span><span class="v num">${n(f[5])} ₪</span>
    <span class="labs">${typeLab(f[2])}${followLab(f[3])}${L("payout", "grow", "צוברת")}${ccyLab(f[4])}${f[4] ? "" : L("tax", "percent", "מס גם על שינויי המטבע")}</span>
    <span class="fees num" style="grid-column:1">דמי ניהול ${f[6][0]}% · ${f[6][1]}% · ${f[6][2]}% (קבועים · משתנים · נאמן)</span></div>`;
}
function filterBar(active) {
  const chips = [["trade", "cal", "קרן מחקה", 5], ["trade", "clock", "קרן סל", 8], ["follow", "swap", "עסקת החלף", 5], ["follow", "mixed", "כמה דרכים יחד", 8], ["currency", "shield", "מנוטרלת מט״ח", 1], ["currency", "dollar", "חשיפה לדולר", 12]];
  return `<div class="fbar"><span class="k">סננו לפי תווית:</span>${chips.map(([f, i, t, c]) => L(f, i, `${t} <span class="cnt num">${c}</span>${active === t ? '<span class="x">✕</span>' : ""}`, `btn ${active === t ? "active" : ""}`)).join("")}</div>`;
}
const hedgePop = `<div class="pop" style="--arrow:236px">
  <span class="close">✕</span>
  <div class="row" style="gap:8px">${L("currency", "shield", "מנוטרלת מט״ח")}<b>מה זה אומר</b></div>
  <div>הקרן עוקבת אחרי המדד בלבד. קרן עם <b>חשיפה לדולר</b> עוקבת אחרי המדד ועוד שער הדולר מול השקל <span class="link small">ETF-10</span>.</div>
  <div style="display:flex;flex-direction:column;gap:6px">
    <span class="muted small">דוגמה לחישוב, לא תחזית: 10,000 ₪, המדד לא זז, והדולר משתנה. בלי עלות הנטרול.</span>
    <div class="fx"><span>הדולר יורד 10%</span><span class="ref"><span class="b" style="display:block;width:75%"></span></span><span class="num">9,000 ₪</span></div>
    <div class="fx"><span></span><span class="ref"><span class="b h" style="display:block;width:83.3%"></span></span><span class="num">10,000 ₪</span></div>
    <div class="fx"><span>הדולר עולה 10%</span><span class="ref"><span class="b" style="display:block;width:91.7%"></span></span><span class="num">11,000 ₪</span></div>
    <div class="fx"><span></span><span class="ref"><span class="b h" style="display:block;width:83.3%"></span></span><span class="num">10,000 ₪</span></div>
    <div class="legend"><span><i style="background:var(--palette-teal-500)"></i>חשיפה לדולר</span><span><i style="background:var(--l-currency)"></i>מנוטרלת מט״ח</span></div>
  </div>
  <div><b>מה זה עולה כאן:</b> בפסגות, הקרן המנוטרלת משאירה <span class="num">1,098 ₪</span> פחות מהזולה עם חשיפה לדולר, מדמי הניהול שלה. עלות הנטרול עצמה נמצאת בהפרש העקיבה, שעוד לא נאסף.</div>
  <div class="row"><span class="link small">הראו רק מנוטרלות (1)</span><span class="link small">הראו רק עם חשיפה לדולר (12)</span></div>
</div>`;
function fundPanel(opts = {}) {
  const list = opts.only ? F.filter(opts.only) : F;
  const tied = opts.only ? [] : list.slice(0, 4);
  const rest = opts.only ? list : list.slice(4, 7);
  return `<div class="card" style="display:flex;flex-direction:column;gap:14px">
    <div class="row" style="justify-content:space-between"><h2>${opts.title || "מה קונים בפסגות"}</h2><span class="tag best">הזול ביותר</span></div>
    ${filterBar(opts.active)}
    ${opts.pop ? hedgePop : ""}
    ${opts.note ? `<div class="callout" style="font-size:14px">${opts.note}</div>` : ""}
    ${tied.length ? `<div class="group"><div class="group-h"><span>שוות לתוכנית שלכם · ההפרש קטן מ־0.5%</span><span class="num">78,556–78,943 ₪</span></div>${tied.map(fundRow).join("")}</div>` : ""}
    <div>${rest.map(fundRow).join("")}</div>
    ${opts.only ? "" : `<span class="link small">עוד 5 קרנות</span>`}
    <span class="note">13 קרנות על המדד עם רשומה באתר; הרשימה המלאה ב־Maya ↗. הפרש העקיבה עוד לא נאסף, ונלקח כאפס.</span>
    <div style="display:flex;flex-direction:column;gap:6px"><h3>מה עושים עכשיו</h3><ol class="steps" style="font-size:14.5px"><li>פותחים חשבון בפסגות · <span class="link small">איך עוברים חשבון</span></li><li>קונים לפי מספר הנייר <span class="num link">${opts.buy || "5139282"}</span></li><li>קובעים הוראת קבע של <span class="num">500 ₪</span> בחודש</li></ol></div>
  </div>`;
}

/* E1: each account with its own cheapest fund, honestly labelled */
function E1() {
  const rows = [...A].sort((x, y) => best(y) - best(x));
  const cols = "22px 92px 100px minmax(0,1fr) 60px 66px 112px";
  return `${intro()}${stats(78943, 500, 2621)}
  <div class="side wide">
    <section style="display:flex;flex-direction:column;gap:6px">
      <h2>איפה לפתוח את החשבון</h2>
      <p class="sub" style="margin:0 0 6px">כל חשבון עם הקרן שנשאר בה הכי הרבה אצלו. הפס: מה החשבון עצמו גובה.</p>
      <div class="tbl-h" style="grid-template-columns:${cols}"><span>#</span><span>חשבון</span><span>מחושב עם</span><span>מה החשבון גובה</span><span class="r">סך הכול</span><span class="r">נשאר</span><span class="r">פחות מהזול</span></div>
      ${rows.map((a, i) => { const t = typeOf(a), left = best(a), c = charges(a[0], t, left), g = TOP - left, fp = t === "e" ? 691 : 0;
        return `<div class="tr ${a[0] === "פסגות" ? "sel" : ""} ${a[0] === YOU ? "you" : ""}" style="grid-template-columns:${cols}">
        <span class="rk">${i + 1}</span><span class="nm">${a[0]}${a[0] === YOU ? "<small>החשבון שלכם</small>" : ""}</span>
        <span class="tt">${t === "m" ? "קרן מחקה" : "קרן סל"}${a[1] == null ? "<small>קרן מחקה: אין בתעריפון</small>" : ""}</span>
        <span>${bar(c)}</span><span class="r num" style="font-size:13.5px">${n(sum(c))} ₪</span><span class="r num">${n(left)} ₪</span>
        <span class="r">${g ? `${GAP(g)}${fp ? `<span class="split">מהחשבון <span class="num">${n(g - fp)}</span></span><span class="split">מהקרן <span class="num">${n(fp)}</span></span>` : ""}` : `<span style="color:var(--best);font-weight:600">הזול</span>`}</span></div>`; }).join("")}
      ${ticks(MAXCH, cols, 3)}
      <div style="padding:6px 8px">${legend}</div>
      <span class="note" style="padding:0 8px">ב־10 מ־14 החשבונות אין בתעריפון שורה ליחידות של קרן נאמנות, ולכן הם מחושבים רק עם קרן סל. מיטב טרייד: התעריפון לא נאסף.</span>
    </section>
    ${fundPanel({ pop: true, active: null })}
  </div>`;
}
/* E2: account x fund type, side by side */
function E2() {
  const rows = [...A].sort((x, y) => best(y) - best(x));
  const cols = "22px 100px minmax(0,1fr) minmax(0,1fr) 92px";
  const cell = (a, t) => { const v = t === "m" ? a[1] : a[2]; if (v == null) return `<div class="cell none">אין בתעריפון שורה לקרן מחקה</div>`;
    const win = typeOf(a) === t, c = charges(a[0], t, v);
    return `<div class="cell ${win ? "win" : ""}"><span class="v"><span class="num">${n(v)} ₪</span><span class="muted small num" style="font-weight:400">גובה ${n(sum(c))} ₪</span></span>${bar(c, MAXCH, 8)}</div>`; };
  return `${intro()}${stats(78943, 500, 2621)}
  <div class="side wide">
    <section style="display:flex;flex-direction:column;gap:6px">
      <h2>איפה לפתוח את החשבון</h2>
      <p class="sub" style="margin:0 0 6px">חשבון גובה אחרת על קרן מחקה ועל קרן סל. מה נשאר לכם בכל חשבון, עם הזולה מכל סוג. המסגרת: הזולה מבין השתיים.</p>
      <div class="tbl-h" style="grid-template-columns:${cols}"><span>#</span><span>חשבון</span><span>${L("trade", "cal", "עם קרן מחקה")}</span><span>${L("trade", "clock", "עם קרן סל")}</span><span class="r">פחות מהזול</span></div>
      ${rows.map((a, i) => { const g = TOP - best(a); return `<div class="tr ${a[0] === "פסגות" ? "sel" : ""} ${a[0] === YOU ? "you" : ""}" style="grid-template-columns:${cols}">
        <span class="rk">${i + 1}</span><span class="nm">${a[0]}${a[0] === YOU ? "<small>החשבון שלכם</small>" : ""}</span>${cell(a, "m")}${cell(a, "e")}
        <span class="r">${g ? GAP(g) : `<span style="color:var(--best);font-weight:600">הזול</span>`}</span></div>`; }).join("")}
      <div style="padding:8px">${legend}</div>
      <span class="note" style="padding:0 8px">בלאומי: עם קרן מחקה נשארים <span class="num">3,286 ₪</span> יותר מאשר עם קרן סל. בעשרה חשבונות אין בתעריפון שורה לקרן מחקה, אז אי אפשר לדעת.</span>
    </section>
    ${fundPanel({ active: "מנוטרלת מט״ח", only: (f) => f[4], title: "מה קונים בפסגות", buy: "5127527",
      note: `מסונן: ${L("currency", "shield", "מנוטרלת מט״ח")} קרן אחת. היא משאירה <span class="num">1,098 ₪</span> פחות מהזולה עם חשיפה לדולר, מדמי הניהול; עלות הנטרול עצמה בהפרש העקיבה, שלא נאסף.` })}
  </div>`;
}
/* E3: compare every account on the same fund type; the type is a label filter that scopes the whole page */
function E3() {
  const rows = [...A].sort((x, y) => y[2] - x[2]);
  const cols = "22px 100px minmax(0,1fr) 64px 70px 92px";
  const topE = 78252;
  return `${intro()}
  <div class="card" style="padding:14px 18px;display:flex;flex-direction:column;gap:8px">
    <div class="segbar"><b style="font-size:15px">השוו את החשבונות על:</b><span class="seg"><span>הזולה בכל חשבון</span><span class="on">קרן סל: אותה קרן בכל חשבון</span><span>קרן מחקה: 4 חשבונות</span></span></div>
    <span class="hint">כל החשבונות מחושבים עם <bdi>ATF סל (4D) S&P 500</bdi>, קרן הסל שנשאר בה הכי הרבה בכל אחד מהם. כך ההפרש הוא רק מה שהחשבון גובה. עם קרן מחקה אפשר לחשב רק 4 חשבונות.</span>
  </div>
  ${stats(topE, 560, topE - 73036)}
  <div class="side wide">
    <section style="display:flex;flex-direction:column;gap:6px">
      <h2>מה כל חשבון גובה על אותה קרן סל</h2>
      <div class="tbl-h" style="grid-template-columns:${cols}"><span>#</span><span>חשבון</span><span>מה החשבון גובה</span><span class="r">סך הכול</span><span class="r">נשאר</span><span class="r">פחות מהזול</span></div>
      ${rows.map((a, i) => { const c = charges(a[0], "e", a[2]), g = topE - a[2]; return `<div class="tr ${a[0] === "פסגות" ? "sel" : ""} ${a[0] === YOU ? "you" : ""}" style="grid-template-columns:${cols}">
        <span class="rk">${i + 1}</span><span class="nm">${a[0]}${a[0] === YOU ? "<small>החשבון שלכם</small>" : ""}</span><span>${bar(c)}</span>
        <span class="r num" style="font-size:13.5px">${n(sum(c))} ₪</span><span class="r num">${n(a[2])} ₪</span><span class="r">${g ? GAP(g) : `<span style="color:var(--best);font-weight:600">הזול</span>`}</span></div>`; }).join("")}
      <div class="tbl-h" style="border:0;padding-top:4px;grid-template-columns:${cols}"><span></span><span></span><span style="display:flex;justify-content:space-between">${[0, 7000, 14000, 21000, 28000].map((t) => `<span class="num">${n(t)}</span>`).join("")}</span><span></span><span></span><span></span></div>
      <div style="padding:6px 8px">${legend}</div>
      <span class="note" style="padding:0 8px">לאומי יורד מהמקום השני למקום השישי: על קרן סל הוא גובה יותר מאשר על קרן מחקה.</span>
    </section>
    ${fundPanel({ active: "קרן סל", only: (f) => f[2] === "e", buy: "1218916" })}
  </div>`;
}
document.getElementById("root").innerHTML = header() + `<main class="wrap">${{ E1, E2, E3 }[OPT]()}</main>`;
</script>
</body>
</html>
