const svg = (k, cls = "ico") => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;
const L = (fam, icon, text) => `<span class="lab ${fam}">${svg(icon, "")}${text}</span>`;
const typeLab = (t) => t === "m" ? L("trade", "cal", "קרן מחקה · פעם ביום") : L("trade", "clock", "קרן סל · כל היום");
const followLab = (f) => f === "swap" ? L("follow", "swap", "עסקת החלף") : L("follow", "mixed", "כמה דרכים יחד");
const refAcc = (x) => `<span class="ref">${svg("bank", "")}${x}</span>`;
const refFund = (x) => `<span class="ref">${svg("pie", "")}<bdi>${x}</bdi></span>`;

/* live 27.10.2026 */
const YALIN = { "פסגות": 78943, "לאומי": 76322, "אי.בי.אי": 71647, "אלטשולר טרייד": 59242 };
const ACCS = ["פסגות","לאומי","ירושלים","וואן זירו","הפועלים","יהב","דיסקונט","מרכנתיל","אי.בי.אי","מסד","הבינלאומי","מזרחי טפחות","אלטשולר טרייד","אקסלנס"];
const FUNDS = [["ילין לפידות מחקה (4D) S&P 500","5139282","m","swap",0,[78943,76322]],["אלטשולר שחם מחקה (4D) S&P 500","5139100","m","mixed",0,[78906,76287]],["קסם S&P 500 (4D) KTF","5124482","m","mixed",0,[78556,75950]],["הראל מחקה (4D) S&P 500","5129275","m","mixed",0,[78556,75950]],["הראל מחקה (4A) S&P 500 - מנוטרלת מט״ח","5127527","m","mixed",1,[77845,75266]],["ATF סל (4D) S&P 500","1218916","e","mixed",0,[78252,73036]],["ילין לפידות סל (4D) S&P 500","1201656","e","swap",0,[77845,72657]],["מור סל (4D) S&P 500","1165810","e","swap",0,[77484,72322]]];
const YOU = "לאומי", BEST = 78943, INVESTED = 70000;

/* illustrative split; consistent with the live "left": costs = account + fund + tax, and left = 81,993 − costs */
function costs(acc, left) {
  const gap = BEST - left, ch = 500 + 1.25 * gap, tax = 2400 - 0.25 * gap, fund = 150;
  const a = acc === "פסגות" ? { buy: 300, cust: 200, acct: 0 } : ch > 20000 ? { buy: ch * 0.3, cust: ch * 0.3, acct: ch * 0.4 } : { buy: ch * 0.45, cust: ch * 0.5, acct: ch * 0.05 };
  return { ...a, fund, tax, acc: a.buy + a.cust + a.acct };
}
const total = (c) => c.acc + c.fund + c.tax;
const seg = (cls, v, scale, label) => v > 0 ? `<i class="${cls}" style="width:${(v / scale) * 100}%">${(v / scale) > 0.07 ? `<span class="num">${n(v)}</span>` : ""}</i>` : "";
function costBar(who, sub, c, scale, you) {
  return `<div class="cbar ${you ? "you" : ""}"><span class="who">${who}<small>${sub}</small></span>
    <div class="segs" style="width:${(total(c) / scale) * 100}%">${seg("f-buy", c.buy, total(c))}${seg("f-cust", c.cust, total(c))}${seg("f-acct", c.acct, total(c))}${seg("f-fundfee", c.fund, total(c))}${seg("f-tax", c.tax, total(c))}</div>
    <span class="tot num">${n(total(c))} ₪</span></div>`;
}
const key = `<div class="key"><span class="grp">${svg("bank")}החשבון:</span><span><i class="f-buy"></i>עמלות קנייה</span><span><i class="f-cust"></i>דמי משמרת</span><span><i class="f-acct"></i>דמי ניהול חשבון</span><span class="grp">${svg("pie")}הקרן:</span><span><i class="f-fundfee"></i>דמי ניהול הקרן</span><span class="grp">המדינה:</span><span><i class="f-tax"></i>מס במכירה</span></div>`;
const accBar = (a, v) => { const c = costs(a, v), max = 11000, w = Math.min(c.acc, max * 0.98);
  return `<div class="stack ${c.acc > max ? "broken" : ""}" style="height:12px;width:${(w / max) * 100}%"><i class="f-buy" style="width:${(c.buy / c.acc) * 100}%"></i><i class="f-cust" style="width:${(c.cust / c.acc) * 100}%"></i>${c.acct ? `<i class="f-acct" style="width:${(c.acct / c.acc) * 100}%"></i>` : ""}</div>`; };

function header() {
  const what = ST === "H1" ? "H · כשהעמוד נפתח: הזוג הזול ביותר" : "H · אחרי שבחרו את החשבון שלהם (לאומי)";
  return `<div class="sketch">סקיצה לדיון · ${what} · לא אינטראקטיבית · "נשאר" מהאתר החי (27.10.2026); הפירוט לפי סוג עלות: להמחשה</div>
  <div class="topbar"><span class="brand">מקור</span><nav class="menu"><span>מדריך</span><span>שאלות שכולם שואלים</span><span>חברות ומסלולים</span><span>השוואה למטרה</span><b>השקעה במדד</b></nav></div>`;
}
function intro() {
  const idx = ["MSCI AC World", "MSCI World", "נאסד״ק 100", "S&P 500", "ת״א-125", "ת״א-35", "ת״א-90", "+ אחר"];
  return `<header style="display:flex;flex-direction:column;gap:12px">
    <div><h1>השקעה במדד</h1><p class="sub">כבר בחרתם מדד. בוחרים חשבון ניירות ערך וקרן, ורואים כמה יישאר לכם.</p></div>
    <div class="row">${idx.map((x) => `<span class="chip ${x === "S&P 500" ? "on" : ""}">${x}</span>`).join("")}</div>
    <div class="row"><span class="pc"><span class="k">סכום</span><span class="v num">10,000 ₪</span></span><span class="pc"><span class="k">כל חודש</span><span class="v num">500 ₪</span></span><span class="pc"><span class="k">תקופה</span><span class="v">10 שנים</span></span><span class="pc mine"><span class="k">החשבון שלכם</span><span class="v">${YOU}</span></span><span class="link small">עוד הנחות</span></div>
  </header>`;
}

function result(acc) {
  const mine = acc !== "פסגות", left = YALIN[acc], c = costs(acc, left), cb = costs("פסגות", BEST);
  const scale = Math.max(total(c), total(cb));
  const invested = `<div class="fig"><span class="k">הפקדתם</span><span class="v num">${n(INVESTED)} ₪</span><span class="n"><span class="num">10,000 ₪</span> ועוד <span class="num">500 ₪</span> × 120 חודשים</span></div>`;
  if (!mine) return `<div class="res">
    <div class="res-top">${invested}<span class="arrow">←</span>
      <div class="fig"><span class="k">נשאר לכם בעוד 10 שנים · <span class="star">★ הזוג הזול ביותר</span></span><span class="v num ul">${n(left)} ₪</span><span class="n">אחרי דמי ניהול ומס, בכסף של היום</span></div>
      <div class="fig" style="text-align:left"><span class="k">לעומת ${YOU}, החשבון שלכם, עם אותה קרן</span><span class="v sm num" style="color:var(--best)">+${n(BEST - YALIN[YOU])} ₪</span></div></div>
    <div class="costs"><h3>כמה זה עולה לכם ב־10 שנים: <span class="num">${n(total(c))} ₪</span><span class="muted small" style="font-weight:400">מתוכם החשבון גובה <span class="num">${n(c.acc)} ₪</span></span></h3>
      ${costBar("פסגות", "עם הקרן הזו", c, scale)}
      ${key}</div>
  </div>`;
  const gapAcc = c.acc - cb.acc, gapTax = cb.tax - c.tax;
  return `<div class="res">
    <div class="res-top" style="grid-template-columns:auto auto minmax(0,1fr)">${invested}<span class="arrow">←</span>
      <div class="pairs">
        <div class="pc2 yours"><span class="h">הבחירה שלכם</span><span class="v num">${n(left)} ₪</span><span class="small muted">נשאר בעוד 10 שנים, אחרי דמי ניהול ומס, בכסף של היום</span></div>
        <div class="pc2"><span class="h">★ הזוג הזול ביותר</span><span class="v num" style="color:var(--best)">${n(BEST)} ₪</span><span class="small"><span class="num">+${n(BEST - left)} ₪</span> אם עוברים לפסגות · <span class="link">בחרו את הזוג הזה</span></span></div>
      </div></div>
    <div class="costs"><h3>כמה זה עולה לכם ב־10 שנים, בכל אחד מהזוגות</h3>
      ${costBar(YOU, "הבחירה שלכם", c, scale, true)}
      ${costBar("פסגות", "הזוג הזול", cb, scale)}
      ${key}
      <div class="why">ההפרש הוא <b>מה שהחשבון גובה</b>: בלאומי <span class="num">${n(c.acc)} ₪</span>, בפסגות <span class="num">${n(cb.acc)} ₪</span>; בעיקר דמי משמרת (<span class="num">${n(c.cust - cb.cust)} ₪</span>) ועמלות קנייה (<span class="num">${n(c.buy - cb.buy)} ₪</span>). דמי ניהול הקרן זהים, כי זו אותה קרן. המס בלאומי קטן ב־<span class="num">${n(gapTax)} ₪</span>, כי גם הרווח קטן יותר. <span class="link">יש לכם עמלה שסיכמתם עם לאומי? הקלידו אותה</span></div>
    </div>
  </div>`;
}

function page() {
  const acc = ST === "H3" ? YOU : "פסגות", fund = FUNDS[0], fi = acc === YOU ? 1 : 0, c = costs(acc, YALIN[acc]);
  const priced = ACCS.filter((a) => YALIN[a] != null).sort((x, y) => YALIN[y] - YALIN[x]);
  const missing = ACCS.filter((a) => YALIN[a] == null);
  const accRows = priced.map((a, i) => { const v = YALIN[a], cc = costs(a, v);
    return `<div class="arow ${a === acc ? "sel" : ""} ${a === YOU ? "you" : ""}"><span class="rad"></span><span class="rk">${i + 1}</span>
      <span class="nm">${a}${a === YOU ? "<small>החשבון שלכם</small>" : a === "פסגות" && acc !== "פסגות" ? `<small class="star">★ הזול</small>` : ""}</span>
      <span class="barcell">${accBar(a, v)}<span class="amt num">${n(cc.acc)} ₪</span></span>
      <span class="r"><span class="num" style="font-weight:600">${n(v)} ₪</span></span></div>`; }).join("");
  const fundRows = (list) => list.map((f) => `<div class="frow ${f === fund ? "sel" : ""}"><span class="rad"></span><span class="t"><b><bdi>${f[0]}</bdi></b><a class="num">${f[1]} ↗</a></span>
      <span class="v"><span class="num">${n(f[5][fi])} ₪</span></span>
      <span></span><span class="labs">${typeLab(f[2])}${followLab(f[3])}${f[4] ? L("currency", "shield", "מנוטרלת מט״ח") : L("currency", "dollar", "חשיפה לדולר")}</span></div>`).join("");
  const fundList = acc === YOU ? `${fundRows(FUNDS.filter((f) => f[2] === "m"))}<div class="sep">קרנות סל: בלאומי נשאר בהן לפחות <span class="num">3,286 ₪</span> פחות</div>${fundRows(FUNDS.filter((f) => f[2] === "e"))}` : fundRows(FUNDS.slice().sort((a, b) => b[5][0] - a[5][0]));
  const lines = `<div class="lines">
      <i class="f-buy"></i><span>עמלות קנייה</span><span class="how">על כל קנייה, אחוז מהסכום</span><span class="amt num">${n(c.buy)} ₪</span>
      <i class="f-cust"></i><span>דמי משמרת</span><span class="how">כל רבעון, אחוז מהשווי</span><span class="amt num">${n(c.cust)} ₪</span>
      ${c.acct ? `<i class="f-acct"></i><span>דמי ניהול חשבון</span><span class="how">סכום קבוע בחודש</span><span class="amt num">${n(c.acct)} ₪</span>` : ""}
      <span class="tot"></span><span class="tot">סך הכול ב־10 שנים</span><span class="tot"></span><span class="amt tot num">${n(c.acc)} ₪</span></div>`;
  return `${intro()}${result(acc)}
  <div class="pair">
    <div class="col">
      <div class="slot" style="min-height:0"><span class="k">${svg("bank")}חשבון ניירות ערך</span><span class="name">${acc === "פסגות" ? "פסגות ניירות ערך (פסגות טרייד)" : "בנק לאומי"}</span>
        <span class="facts"><span>בפיקוח רשות ני״ע</span><a>${acc === "פסגות" ? "איך פותחים" : "התעריפון של לאומי ↗"}</a></span></div>
      <div class="listh"><b>כל החשבונות</b><span class="cond">כשקונים בהם את ${refFund(fund[0])} · בחרו קרן אחרת, והרשימה תסתדר מחדש</span></div>
      <div class="ahead"><span></span><span>#</span><span>חשבון</span><span>מה החשבון גובה ב־10 שנים</span><span class="r">נשאר</span></div>
      ${accRows}
      <div class="key" style="padding:8px 16px"><span><i class="f-buy"></i>עמלות קנייה</span><span><i class="f-cust"></i>דמי משמרת</span><span><i class="f-acct"></i>דמי ניהול חשבון</span><span>⫽ הפס נחתך: הסכום ארוך מהשטח</span></div>
      <div class="na"><b>${missing.length} חשבונות לא מחושבים עם הקרן הזו:</b> בתעריפון שלהם אין שורה ליחידות של קרן נאמנות. כשזה ייאסף, הם יצטרפו לרשימה.</div>
      <div style="padding:2px 16px 14px;font-size:13.5px;color:var(--muted-foreground)">${missing.join(" · ")}</div>
    </div>
    <div class="plus"><span>+</span></div>
    <div class="col">
      <div class="slot" style="min-height:0"><span class="k">${svg("pie")}קרן</span><span class="name" style="font-size:19px;white-space:nowrap"><bdi>${fund[0]}</bdi> <a class="num" style="font-size:14px;font-weight:500;color:var(--link)">${fund[1]} ↗</a></span><span class="facts"><span>דמי ניהול <span class="num">0% · 0% · 0.02%</span> (קבועים · משתנים · נאמן)</span></span>
        <div class="lines"><i class="f-fundfee"></i><span>דמי ניהול הקרן</span><span class="how">נלקחים מתוך הקרן</span><span class="amt num">${n(c.fund)} ₪</span></div></div>
      <div class="listh"><b>כל הקרנות על S&P 500</b><span class="cond">בחשבון ${refAcc(acc)} · בחרו חשבון אחר, והרשימה תסתדר מחדש</span></div>
      <div class="fbar"><span class="k">סננו:</span>${L("trade", "cal", 'קרן מחקה <span class="cnt num">5</span>')}${L("trade", "clock", 'קרן סל <span class="cnt num">8</span>')}${L("follow", "swap", 'עסקת החלף <span class="cnt num">5</span>')}${L("currency", "shield", 'מנוטרלת מט״ח <span class="cnt num">1</span>')}</div>
      ${fundList}
      <div style="padding:10px 16px;display:flex;flex-direction:column;gap:6px"><span class="link small">עוד 5 קרנות</span><span class="note">13 קרנות על המדד עם רשומה באתר; הרשימה המלאה ב־Maya ↗. הפרש העקיבה עוד לא נאסף, ונלקח כאפס.</span></div>
    </div>
  </div>`;
}
document.getElementById("root").innerHTML = header() + `<main class="wrap">${page()}</main>`;
</script>
</body>
</html>
