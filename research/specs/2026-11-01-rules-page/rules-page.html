:root{color-scheme:dark;--bg:oklch(.17 .004 80);--card:oklch(.2 .005 80);--pop:oklch(.235 .006 80);--sec:oklch(.27 .007 80);--line:oklch(.31 .008 80);--fg:oklch(.955 .005 80);--mut:oklch(.82 .008 80);--dim:oklch(.5 .01 80);--pri:oklch(.82 .081 190);--pri-fg:oklch(.17 .004 80);--inf:oklch(.895 .052 190);--amb:oklch(.895 .074 70);--amb-b:oklch(.39 .084 70);--amb-bg:oklch(.24 .054 70)}
*{box-sizing:border-box}
html,body{margin:0;background:oklch(.13 .004 80);color:var(--fg);font:16px/1.7 Inter,Heebo,sans-serif}
a{color:var(--pri);text-decoration:none}a:hover{text-decoration:underline}
button,input,select{font:inherit;color:inherit}
.n,.id{font-variant-numeric:tabular-nums}.id{font-variant-numeric:tabular-nums slashed-zero;font-weight:600}.out{font-size:13px}
.bar{position:sticky;top:0;z-index:5;background:oklch(.13 .004 80);border-block-end:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center}
.set[hidden]{display:none!important}.bar b{font-size:14px;font-weight:500;color:var(--mut)}.bar .set{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bar button{min-height:40px;padding:0 12px;border:0;border-radius:6px;background:var(--sec);font-size:14px;cursor:pointer}
.bar button[aria-pressed=true]{background:var(--pri);color:var(--pri-fg);font-weight:500}
.rec{font-size:13px;margin-inline-start:6px}
.intro{max-width:1280px;margin:0 auto;padding:16px}
.intro h1{font-size:20px;margin:0 0 4px;font-weight:600}.intro p{margin:0;font-size:14px;color:var(--mut);max-width:820px}
.why{font-size:15px!important;color:var(--fg)!important;margin-block-start:8px!important}
.hand{font-style:normal;font-size:13px;color:var(--amb);background:var(--amb-bg);border:1px dashed var(--amb-b);border-radius:4px;padding:0 6px;white-space:normal;display:inline-block;line-height:1.6}
.frame-wrap{display:flex;justify-content:center;padding:0 16px 48px}
.frame{width:1280px;max-width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;overflow:hidden;container-type:inline-size;min-height:700px}
.frame.phone{width:390px}
.nav{display:flex;gap:24px;align-items:center;height:64px;padding-inline:88px;border-block-end:1px solid var(--line);font-size:15px;white-space:nowrap;overflow:hidden}
.nav strong{font-weight:700;margin-inline-end:8px}.nav .on{color:var(--pri)}
main{max-width:1104px;margin:0 auto;padding:24px 16px 48px;display:flex;flex-direction:column;gap:32px}
main.wide{max-width:none;padding-inline:24px;gap:12px}
h1{font-size:30px;line-height:1.3;margin:0;font-weight:600}h2{font-size:20px;line-height:1.4;margin:0 0 8px;font-weight:600}h3{font-size:16px;line-height:1.5;margin:0;font-weight:600}
.head{display:flex;flex-direction:column;gap:8px}.lede{margin:0;font-size:18px;color:var(--mut)}
.count{font-weight:400;font-size:14px;color:var(--mut)}.sub{margin:0;font-size:14px;color:var(--mut)}
.field{display:flex;align-items:center;gap:10px;height:48px;padding-inline:14px;border:1px solid var(--dim);border-radius:8px;background:var(--card);color:var(--mut)}
.field input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);direction:rtl}.field input::placeholder{color:var(--mut)}
.field.big{height:64px;font-size:18px;margin-block-start:8px;border-color:var(--pri)}
.status{margin:0;font-size:14px;color:var(--mut)}
.ex{margin:-16px 0 0;font-size:14px;color:var(--mut)}.link{background:none;border:0;padding:0 0 0 12px;color:var(--pri);cursor:pointer;min-height:32px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;gap:10px;min-width:0;overflow-wrap:anywhere}
.text{margin:0;font-size:15px;line-height:1.65}
.src{border-block-start:1px solid var(--line);padding-block-start:8px;font-size:14px}.src p{margin:0}.quote{color:var(--fg)}.checked{color:var(--mut);font-size:13px}
.figs{margin:0;display:flex;flex-direction:column;gap:2px;font-size:14px}.figs div{display:flex;justify-content:space-between;gap:12px}.figs dt{color:var(--mut)}.figs dd{margin:0;white-space:nowrap}
.sourced{border-block-end:1.5px solid var(--mut);font-weight:600}
.more summary{cursor:pointer;font-size:14px;color:var(--pri);min-height:32px}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-block:12px}.seg button{min-height:44px;padding:0 12px;border:0;border-radius:6px;background:var(--sec);font-size:14px;cursor:pointer}.seg button[aria-pressed=true]{background:var(--pri);color:var(--pri-fg);font-weight:500}
table.docs{width:100%;table-layout:fixed;border-collapse:collapse;font-size:14px}
.docs th{font-weight:500;text-align:start;color:var(--mut);padding:8px 8px 8px 12px;border-block-end:1px solid var(--line)}.docs td{padding:9px 8px 9px 12px;border-block-end:1px solid var(--sec);vertical-align:top}
.c-co{width:22%}.c-doc{width:auto}.c-ver{width:96px}.c-page{width:150px}
.docs strong{font-weight:500}.pages a{white-space:nowrap;display:inline-block;margin-inline-end:8px}
.show-narrow{display:none}.block-line{display:block;color:var(--mut);font-size:13px}
.pick{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mut)}.pick select{height:44px;background:var(--card);border:1px solid var(--dim);border-radius:6px;padding-inline:8px;color:var(--fg);max-width:100%;min-width:0}.pick.wide{margin-block-end:8px}.pick.wide select{flex:1}
.filterline{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-block-start:-16px}
.blocks{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.block{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.block ul{list-style:none;margin:6px 0;padding:0;font-size:14px;display:flex;flex-direction:column;gap:6px;line-height:1.5}.block .all{font-size:14px;margin-block-start:auto}.block a .id{color:inherit}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}.col-law{display:flex;flex-direction:column;gap:12px}.col-law h2{margin:0}
.plain{list-style:none;margin:8px 0 0;padding:0}.plain li{padding-block:10px;border-block-end:1px solid var(--sec)}
.trio{display:grid;grid-template-columns:260px 380px 1fr;gap:16px;align-items:start}
.rail{display:flex;flex-direction:column;gap:12px;position:sticky;top:12px}.rail fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column}.rail legend{font-size:14px;color:var(--mut);padding:0;margin-block-end:4px}
.radio{display:flex;align-items:center;gap:8px;min-height:44px;font-size:14px;line-height:1.35}.radio .count{margin-inline-start:auto}
.list>*{flex-shrink:0}.list{display:flex;flex-direction:column;gap:2px;max-height:780px;overflow-y:auto;padding-inline-end:4px;border-inline:1px solid var(--line);padding-inline:12px}.list h2{font-size:16px;margin:12px 0 4px}
.row{display:block;width:100%;text-align:start;background:none;border:0;border-block-end:1px solid var(--sec);padding:9px 6px;font-size:14px;line-height:1.5;cursor:pointer;min-height:44px}.row strong{font-weight:500;display:block}.row:hover,.row[aria-current=true]{background:var(--sec)}.row .id{margin-inline-end:6px}
.today{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;padding:16px}.today img{width:100%;display:block;border:1px solid var(--line);border-radius:6px}.today figcaption{font-size:14px;color:var(--mut);margin-block-end:6px}.today figure{margin:0}
@media (max-width:700px){.bar{position:static}.frame-wrap{padding-inline:0}.frame{border-inline:0;border-radius:0}}
@container (max-width:700px){
 .nav{padding-inline:16px;gap:16px;font-size:14px}.nav span:not(.on){display:none}
 main{padding:16px 16px 40px;gap:24px}main.wide{padding-inline:16px}h1{font-size:24px}.lede{font-size:16px}.field.big{height:56px;font-size:16px}
 .two,.vs,.blocks,.trio,.today{grid-template-columns:minmax(0,1fr)}.vs{gap:24px}.rail{position:static}.list{max-height:none;border:0;padding-inline:0}
 .hide-narrow{display:none}.show-narrow{display:block;color:var(--mut);font-size:13px}.c-co{width:auto}.c-doc,.c-ver{width:0}.c-page{width:116px}
 .pages a{display:block;min-height:44px;line-height:44px;margin:0}.docs td{padding-block:4px}.card{padding:14px}
}</style></head><body>

const options={"a":{"name":"הטענה קודם","tag":"מומלצת","why":"שדה אחד בראש העמוד, ומתחתיו שתי קבוצות: החוק, ואז החברות. בלי טענה, העמוד נפתח על החוקים עצמם.","claim":"<header class=\"nav\"><strong>מקור</strong><span>מדריך</span><span class=\"on\">חוקים וכללים</span><span>שאלות שכולם שואלים</span><span>חברות ומסלולים</span><span>השוואה למטרה</span><span>השקעה במדד</span></header><main><div class=\"head\"><h1>חוקים וכללים</h1><p class=\"lede\">אמרו לכם משהו על הכסף, או שאתם קוראים תנאים של בנק? כתבו את זה כאן ותראו מה כתוב, ואיפה.</p><div class=\"field big\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"11\" cy=\"11\" r=\"7\"/><path d=\"m20 20-4-4\"/></svg><input value=\"מותר לבנק לשנות עמלה בלי להודיע\" placeholder=\"כתבו מה אמרו לכם, או מה קראתם בתנאים\" aria-label=\"הטענה\" readonly></div></div>\n  <p class=\"status\" role=\"status\">נמצאו <bdi dir=\"ltr\" class=\"n\">2</bdi> חוקים וכללים · <bdi dir=\"ltr\" class=\"n\">28</bdi> מסמכים של חברות <em class=\"hand\">השורות כאן נבחרו ביד: זה מה שהחיפוש החדש צריך להחזיר על הטענה הזאת</em></p>\n  <section><h2>מה כתוב בחוק ובכללים <span class=\"count\">· <bdi dir=\"ltr\" class=\"n\">2</bdi></span></h2><div class=\"two\"><article class=\"card\" data-rule=\"BRK-21\">\n    <h3><bdi dir=\"ltr\" class=\"id\">BRK-21</bdi> · בנקים: הודעה על שינוי עמלות לפי ימי ההודעה המוקדמת</h3>\n    <p class=\"text\">בנק חייב להודיע לכל לקוחותיו על שינוי בתנאי החשבון, ובכלל זה בתעריפון העמלות, לפי ימי ההודעה המוקדמת לפני השינוי; על שינוי לטובת הלקוח מותר להודיע בתוך ימי עסקים ספורים אחריו. ההודעות מתפרסמות בשני עיתונים יומיים, על לוח בסניף ובאתר תחת הכותרת הודעות על שינויים, וכשהשינוי מעלה עמלות על שירותים מתמשכים, ובהם עמלות על מכירת ניירות ערך, הבנק חייב להודיע ללקוח גם בכתב מראש. הנוסח שנקרא עדכני לתיקון ישן יחסית, ולבתי השקעות לא נמצא כלל דומה.</p>\n    <dl class=\"figs\"><div><dt>ימי ההודעה המוקדמת לפני שינוי</dt><dd><span class=\"sourced\"><bdi dir=\"ltr\" class=\"n\">14</bdi></span> ימים</dd></div></dl>\n    <div class=\"src\">\n    <a href=\"https://www.boi.org.il/media/rvzi1ngd/151.pdf#page=3\" target=\"_blank\" rel=\"noreferrer\">בנק ישראל · כללי הבנקאות (שירות ללקוח) (גילוי נאות ומסירת מסמכים), התשנ״ב-1992, עמודים 3 עד 4, סעיף 5(א)(1), (3), (4), (5) <span class=\"out\">↗</span></a>\n    <p class=\"quote\">״עמלות על מכירת ניירות ערך״</p>\n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">26.10.2026</bdi></p>\n  </div>\n    \n  </article><article class=\"card\" data-rule=\"BANK-19\">\n    <h3><bdi dir=\"ltr\" class=\"id\">BANK-19</bdi> · הודעה מראש לפני סיום הטבה בנקאית</h3>\n    <p class=\"text\">בנק חייב להודיע ללקוח, לפחות מספר ימים מראש, על סיום הטבה בנקאית, כלומר הטבה בריבית או בעמלה שנמשכת יותר משלושה חודשים לפי ההסכם, או על סיום שלב בהטבה מדורגת, גם אם הבנק מחדש אותה אחר כך בתנאים אחרים. ההודעה בכתב, בדרך המהירה ביותר שזמינה ללקוח אלא אם ביקש אחרת, וגם בערוץ ההודעות המוסכם. הכלל חל גם על הטבות ריבית על יתרות זכות ועל פיקדונות, לא רק על עמלות.</p>\n    <dl class=\"figs\"><div><dt>ימי הודעה מראש לפני סיום ההטבה</dt><dd><span class=\"sourced\"><bdi dir=\"ltr\" class=\"n\">21</bdi></span> ימים</dd></div></dl>\n    <div class=\"src\">\n    <a href=\"https://fs.knesset.gov.il/25/law/25_lsr_4048300.pdf#page=2\" target=\"_blank\" rel=\"noreferrer\">הכנסת · חוק הבנקאות (שירות ללקוח) (תיקון מס' 37), התשפ&quot;ד-2024 <span class=\"out\">↗</span></a>\n    \n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div>\n    \n  </article></div></section>\n  <section><h2>מה כתוב אצל החברות <span class=\"count\">· <bdi dir=\"ltr\" class=\"n\">28</bdi> מסמכים</span></h2>\n  <p class=\"sub\">כל מסמך חל רק על החברה שלו. הקישור פותח את העמוד שבו הנושא מופיע; האתר לא מסכם מה כתוב שם.</p><div class=\"seg\" role=\"group\" aria-label=\"סוג החברה\" data-table=\"a-docs\">\n      <button type=\"button\" data-g=\"bank\" aria-pressed=\"true\">בנקים <bdi dir=\"ltr\" class=\"n\">10</bdi></button><button ty 19</bdi> · אם חברה מנהלת קורסת: הניהול עובר לחברה אחרת</a></li><li><a href=\"#\"><bdi dir=\"ltr\" class=\"id\">REG-04</bdi> · אין ביטוח פיקדונות; החוק מחייב בחינה</a></li><li><a href=\"#\"><bdi dir=\"ltr\" class=\"id\">REG-06</bdi> · אם בנק קורס: ערבות לפי שיקול דעת, מנהל מורשה</a></li></ul><a class=\"all\" href=\"#\">לכל ה־<bdi dir=\"ltr\" class=\"n\">74</bdi></a></section><section class=\"block\"><h3>איך המוצר בנוי <span class=\"count\">· <bdi dir=\"ltr\" class=\"n\">32</bdi></span></h3><p class=\"sub\">מטבע, חלוקה, מדדים, מה כתוב בדוח ואיך קוראים לדברים</p><ul><li><a href=\"#\"><bdi dir=\"ltr\" class=\"id\">IRA-11</bdi> · במה מותר להשקיע בניהול אישי</a></li><li><a href=\"#\"><bdi dir=\"ltr\" class=\"id\">BANK-15</bdi> · מוצרי שוק הכסף: פיקדונות, קרנות כספיות ומק״ם יחד</a></li><li><a href=\"#\"><bdi dir=\"ltr\" class=\"id\">MF-32</bdi> · קרן כספית: מטבע וקרנות ללא קונצרני</a></li><li><a href=\"#\"><bdi dir=\"ltr\" class=\"id\">ETF-10</bdi> · נכס המעקב והמטבע</a></li></ul><a class=\"all\" href=\"#\">לכל ה־<bdi dir=\"ltr\" class=\"n\">32</bdi></a></section><section class=\"block co\"><h3>מה כתוב אצל החברות</h3><p class=\"sub\">מסמכים של בנקים, בתי השקעות וקופות, לפי נושא</p><ul><li><a href=\"#\" >דיבידנד וניכוי מס <span class=\"count\">· <bdi dir=\"ltr\" class=\"n\">35</bdi></span></a></li><li><a href=\"#\" >העברת ניירות ערך לגוף אחר <span class=\"count\">· <bdi dir=\"ltr\" class=\"n\">30</bdi></span></a></li><li><a href=\"#\" data-to=\"claim\">שינוי תעריף והודעה עליו <span class=\"count\">· <bdi dir=\"ltr\" class=\"n\">28</bdi></span></a></li><li><a href=\"#\" >דמי ניהול <span class=\"count\">· <bdi dir=\"ltr\" class=\"n\">20</bdi></span></a></li><li><a href=\"#\" >תנאי משיכה <span class=\"count\">· <bdi dir=\"ltr\" class=\"n\">20</bdi></span></a></li><li><a href=\"#\" >המרת מטבע <span class=\"count\">· <bdi dir=\"ltr\" class=\"n\">19</bdi></span></a></li><li><a href=\"#\" >סגירת חשבון <span class=\"count\">· <bdi dir=\"ltr\" class=\"n\">14</bdi></span></a></li><li><a href=\"#\" >דמי משמרת <span class=\"count\">· <bdi dir=\"ltr\" class=\"n\">12</bdi></span></a></li><li><a href=\"#\" >הוספה וניכוי בפדיון <span class=\"count\">· <bdi dir=\"ltr\" class=\"n\">9</bdi></span></a></li><li><a href=\"#\" >עמלת קנייה ומכירה <span class=\"count\">· <bdi dir=\"ltr\" class=\"n\">9</bdi></span></a></li></ul></section></div></main>"},"b":{"name":"החוק מול החברה","tag":"","why":"אותו שדה, אבל החוק והחברות זה לצד זה, ובוחרים חברה אחת. נוח להשוואה; פחות מקום לטקסט של הכלל.","claim":"<header class=\"nav\"><strong>מקור</strong><span>מדריך</span><span class=\"on\">חוקים וכללים</span><span>שאלות שכולם שואלים</span><span>חברות ומסלולים</span><span>השוואה למטרה</span><span>השקעה במדד</span></header><main><div class=\"head\"><h1>חוקים וכללים</h1><p class=\"lede\">אמרו לכם משהו על הכסף, או שאתם קוראים תנאים של בנק? כתבו את זה כאן ותראו מה כתוב, ואיפה.</p><div class=\"field big\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"11\" cy=\"11\" r=\"7\"/><path d=\"m20 20-4-4\"/></svg><input value=\"מותר לבנק לשנות עמלה בלי להודיע\" placeholder=\"כתבו מה אמרו לכם, או מה קראתם בתנאים\" aria-label=\"הטענה\" readonly></div></div>\n  <p class=\"status\" role=\"status\">נמצאו <bdi dir=\"ltr\" class=\"n\">2</bdi> חוקים וכללים · <bdi dir=\"ltr\" class=\"n\">28</bdi> מסמכים של חברות <em class=\"hand\">השורות כאן נבחרו ביד: זה מה שהחיפוש החדש צריך להחזיר על הטענה הזאת</em></p>\n  <div class=\"vs\">\n    <section class=\"col-law\"><h2>מה כתוב בחוק ובכללים <span class=\"count\">· <bdi dir=\"ltr\" class=\"n\">2</bdi></span></h2><article class=\"card\" data-rule=\"BRK-21\">\n    <h3><bdi dir=\"ltr\" class=\"id\">BRK-21</bdi> · בנקים: הודעה על שינוי עמלות לפי ימי ההודעה המוקדמת</h3>\n    <p class=\"text\">בנק חייב להודיע לכל לקוחותיו על שינוי בתנאי החשבון, ובכלל זה בתעריפון העמלות, לפי ימי ההודעה המוקדמת לפני השינוי; על שינוי לטובת הלקוח מותר להודיע בתוך ימי עסקים ספורים אחריו. ההודעות מתפרסמות בשני עיתונים יומיים, על לוח בסניף ובאתר תחת הכותרת הודעות על שינויים, וכשהשינוי מעלה עמלות על שירותים מתמשכים, ובהם עמלות על מכירת ניירות ערך, הבנק חייב להודיע ללקוח גם בכתב מראש. הנוסח שנקרא עדכני לתיקון ישן יחסית, ולבתי השקעות לא נמצא כלל דומה.</p>\n    <dl class=\"figs\"><div><dt>ימי ההודעה המוקדמת לפני שינוי</dt><dd><span class=\"sourced\"><bdi dir=\"ltr\" class=\"n\">14</bdi></span> ימים</dd></div></dl>\n    <div class=\"src\">\n    <a href=\"https://www.boi.org.il/media/rvzi1ngd/151.pdf#page=3\" target=\"_blank\" rel=\"noreferrer\">בנק ישראל · כללי הבנקאות (שירות ללקוח) (גילוי נאות ומסירת מסמכים), התשנ״ב-1992, עמודים 3 עד 4, סעיף 5(א)(1), (3), (4), (5) <span class=\"out\">↗</span></a>\n    <p class=\"quote\">״עמלות על מכירת ניירות ערך״</p>\n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">26.10.2026</bdi></p>\n  </div>\n    \n  </article><article class=\"card\" data-rule=\"BANK-19\">\n    <h3><bdi dir=\"ltr\" class=\"id\">BANK-19</bdi> · הודעה מראש לפני סיום הטבה בנקאית</h3>\n    <p class=\"text\">בנק חייב להודיע ללקוח, לפחות מספר ימים מראש, על סיום הטבה בנקאית, כלומר הטבה בריבית או בעמלה שנמשכת יותר משלושה חודשים לפי ההסכם, או על סיום שלב בהטבה מדורגת, גם אם הבנק מחדש אותה אחר כך בתנאים אחרים. ההודעה בכתב, בדרך המהירה ביותר שזמינה ללקוח אלא אם ביקש אחרת, וגם בערוץ ההודעות המוסכם. הכלל חל גם על הטבות ריבית על יתרות זכות ועל פיקדונות, לא רק על עמלות.</p>\n    <dl class=\"figs\"><div><dt>ימי הודעה מראש לפני סיום ההטבה</dt><dd><span class=\"sourced\"><bdi dir=\"ltr\" class=\"n\">21</bdi></span> ימים</dd></div></dl>\n    <div class=\"src\">\n    <a href=\"https://fs.knesset.gov.il/25/law/25_lsr_4048300.pdf#page=2\" target=\"_blank\" rel=\"noreferrer\">הכנסת · חוק הבנקאות (שירות ללקוח) (תיקון מס' 37), התשפ&quot;ד-2024 <span class=\"out\">↗</span></a>\n    \n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div>\n    \n  </article></section>\n    <section class=\"col-co\"><h2>מה כתוב אצל החברות</h2>\n      <label class=\"p  dir=\"ltr\" class=\"id\">PF-19</bdi> מועד ההעברה, פיצוי על איחור, ואין עמלת העברה</button></div><div data-shelf=\"protection\" hidden><h2>מי מפקח ומה מוגן <span class=\"count\">· <bdi dir=\"ltr\" class=\"n\">74</bdi></span></h2><button type=\"button\" class=\"row\" data-open=\"REG-18\"><bdi dir=\"ltr\" class=\"id\">REG-18</bdi> נכסי קופות הגמל והפנסיה: בנאמנות, בנפרד, לא לעיקול</button><button type=\"button\" class=\"row\" data-open=\"REG-19\"><bdi dir=\"ltr\" class=\"id\">REG-19</bdi> אם חברה מנהלת קורסת: הניהול עובר לחברה אחרת</button><button type=\"button\" class=\"row\" data-open=\"REG-04\"><bdi dir=\"ltr\" class=\"id\">REG-04</bdi> אין ביטוח פיקדונות; החוק מחייב בחינה</button><button type=\"button\" class=\"row\" data-open=\"REG-06\"><bdi dir=\"ltr\" class=\"id\">REG-06</bdi> אם בנק קורס: ערבות לפי שיקול דעת, מנהל מורשה</button></div><div data-shelf=\"structure\" hidden><h2>איך המוצר בנוי <span class=\"count\">· <bdi dir=\"ltr\" class=\"n\">32</bdi></span></h2><button type=\"button\" class=\"row\" data-open=\"IRA-11\"><bdi dir=\"ltr\" class=\"id\">IRA-11</bdi> במה מותר להשקיע בניהול אישי</button><button type=\"button\" class=\"row\" data-open=\"BANK-15\"><bdi dir=\"ltr\" class=\"id\">BANK-15</bdi> מוצרי שוק הכסף: פיקדונות, קרנות כספיות ומק״ם יחד</button><button type=\"button\" class=\"row\" data-open=\"MF-32\"><bdi dir=\"ltr\" class=\"id\">MF-32</bdi> קרן כספית: מטבע וקרנות ללא קונצרני</button><button type=\"button\" class=\"row\" data-open=\"ETF-10\"><bdi dir=\"ltr\" class=\"id\">ETF-10</bdi> נכס המעקב והמטבע</button></div></div>\n  <div class=\"pane\" data-pane><article class=\"card\" data-rule=\"TXI-03\">\n    <h3><bdi dir=\"ltr\" class=\"id\">TXI-03</bdi> · מס על ריבית מפיקדון לא צמוד</h3>\n    <p class=\"text\">אם הריבית שולמה על נכס שאינו צמוד למדד, או צמוד רק בחלקו לעליית המדד, או לא צמוד עד הפדיון או ההחזר, היחיד משלם על הריבית מס בשיעור הקבוע. השיעור חל על כל הריבית הנומינלית, בלי ניכוי אינפלציה. החוק מנסח זאת כשיעור קבוע ולא כתקרה. שר האוצר רשאי לשנות את השיעור בצו בהתאם לשינוי במדד; צו כזה לא נמצא.</p>\n    <dl class=\"figs\"><div><dt>שיעור המס על ריבית לא צמודה</dt><dd><span class=\"sourced\"><bdi dir=\"ltr\" class=\"n\">15</bdi></span> </dd></div></dl>\n    <div class=\"src\">\n    <a href=\"https://www.gov.il/BlobFolder/legalinfo/law_pkudat_mas_hachnasa/he/LegalInformation_kesher_%D7%A4%D7%A7%D7%95%D7%93%D7%AA%20%D7%9E%D7%A1%20%D7%94%D7%9B%D7%A0%D7%A1%D7%94%20%5B%D7%A0%D7%95%D7%A1%D7%97%20%D7%97%D7%93%D7%A9%5D%20-%20%D7%9C%D7%90%20%D7%9E%D7%A8%D7%95%D7%91%D7%93.pdf#page=204\" target=\"_blank\" rel=\"noreferrer\">רשות המסים · פקודת מס הכנסה [נוסח חדש], נוסח משולב (רשות המסים), עמוד 204, סעיף 125ג(ג)(1)-(2) <span class=\"out\">↗</span></a>\n    <p class=\"quote\">״שולמה הריבית על נכס שאינו צמוד למדד, או שהוא צמוד בחלקו לשיעור עליית המדד, כולו או חלקו, או שאינו צמוד למדד עד לפדיון או עד להחזר, תחויב הכנסתו של היחיד מריבית במס בשיעור של 15%״</p>\n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div>\n    <details class=\"more\"><summary>עוד <bdi dir=\"ltr\" class=\"n\">1</bdi> מקור</summary><div class=\"src\">\n    <a href=\"https://www.gov.il/BlobFolder/generalpage/income-tax-guide-knowyourright/he/Guides_IncomeTax_da-2025.pdf#page=42\" target=\"_blank\" rel=\"noreferrer\">רשות המסים · דע זכויותיך וחובותיך 2025, עמוד 42 <span class=\"out\">↗</span></a>\n    \n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div></details>\n  </article></div></div></main>"}};
const panes={"BRK-21":"<article class=\"card\" data-rule=\"BRK-21\">\n    <h3><bdi dir=\"ltr\" class=\"id\">BRK-21</bdi> · בנקים: הודעה על שינוי עמלות לפי ימי ההודעה המוקדמת</h3>\n    <p class=\"text\">בנק חייב להודיע לכל לקוחותיו על שינוי בתנאי החשבון, ובכלל זה בתעריפון העמלות, לפי ימי ההודעה המוקדמת לפני השינוי; על שינוי לטובת הלקוח מותר להודיע בתוך ימי עסקים ספורים אחריו. ההודעות מתפרסמות בשני עיתונים יומיים, על לוח בסניף ובאתר תחת הכותרת הודעות על שינויים, וכשהשינוי מעלה עמלות על שירותים מתמשכים, ובהם עמלות על מכירת ניירות ערך, הבנק חייב להודיע ללקוח גם בכתב מראש. הנוסח שנקרא עדכני לתיקון ישן יחסית, ולבתי השקעות לא נמצא כלל דומה.</p>\n    <dl class=\"figs\"><div><dt>ימי ההודעה המוקדמת לפני שינוי</dt><dd><span class=\"sourced\"><bdi dir=\"ltr\" class=\"n\">14</bdi></span> ימים</dd></div></dl>\n    <div class=\"src\">\n    <a href=\"https://www.boi.org.il/media/rvzi1ngd/151.pdf#page=3\" target=\"_blank\" rel=\"noreferrer\">בנק ישראל · כללי הבנקאות (שירות ללקוח) (גילוי נאות ומסירת מסמכים), התשנ״ב-1992, עמודים 3 עד 4, סעיף 5(א)(1), (3), (4), (5) <span class=\"out\">↗</span></a>\n    <p class=\"quote\">״עמלות על מכירת ניירות ערך״</p>\n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">26.10.2026</bdi></p>\n  </div>\n    \n  </article>","BANK-19":"<article class=\"card\" data-rule=\"BANK-19\">\n    <h3><bdi dir=\"ltr\" class=\"id\">BANK-19</bdi> · הודעה מראש לפני סיום הטבה בנקאית</h3>\n    <p class=\"text\">בנק חייב להודיע ללקוח, לפחות מספר ימים מראש, על סיום הטבה בנקאית, כלומר הטבה בריבית או בעמלה שנמשכת יותר משלושה חודשים לפי ההסכם, או על סיום שלב בהטבה מדורגת, גם אם הבנק מחדש אותה אחר כך בתנאים אחרים. ההודעה בכתב, בדרך המהירה ביותר שזמינה ללקוח אלא אם ביקש אחרת, וגם בערוץ ההודעות המוסכם. הכלל חל גם על הטבות ריבית על יתרות זכות ועל פיקדונות, לא רק על עמלות.</p>\n    <dl class=\"figs\"><div><dt>ימי הודעה מראש לפני סיום ההטבה</dt><dd><span class=\"sourced\"><bdi dir=\"ltr\" class=\"n\">21</bdi></span> ימים</dd></div></dl>\n    <div class=\"src\">\n    <a href=\"https://fs.knesset.gov.il/25/law/25_lsr_4048300.pdf#page=2\" target=\"_blank\" rel=\"noreferrer\">הכנסת · חוק הבנקאות (שירות ללקוח) (תיקון מס' 37), התשפ&quot;ד-2024 <span class=\"out\">↗</span></a>\n    \n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div>\n    \n  </article>","TXI-03":"<article class=\"card\" data-rule=\"TXI-03\">\n    <h3><bdi dir=\"ltr\" class=\"id\">TXI-03</bdi> · מס על ריבית מפיקדון לא צמוד</h3>\n    <p class=\"text\">אם הריבית שולמה על נכס שאינו צמוד למדד, או צמוד רק בחלקו לעליית המדד, או לא צמוד עד הפדיון או ההחזר, היחיד משלם על הריבית מס בשיעור הקבוע. השיעור חל על כל הריבית הנומינלית, בלי ניכוי אינפלציה. החוק מנסח זאת כשיעור קבוע ולא כתקרה. שר האוצר רשאי לשנות את השיעור בצו בהתאם לשינוי במדד; צו כזה לא נמצא.</p>\n    <dl class=\"figs\"><div><dt>שיעור המס על ריבית לא צמודה</dt><dd><span class=\"sourced\"><bdi dir=\"ltr\" class=\"n\">15</bdi></span> </dd></div></dl>\n    <div class=\"src\">\n    <a href=\"https://www.gov.il/BlobFolder/legalinfo/law_pkudat_mas_hachnasa/he/LegalInformation_kesher_%D7%A4%D7%A7%D7%95%D7%93%D7%AA%20%D7%9E%D7%A1%20%D7%94%D7%9B%D7%A0%D7%A1%D7%94%20%5B%D7%A0%D7%95%D7%A1%D7%97%20%D7%97%D7%93%D7%A9%5D%20-%20%D7%9C%D7%90%20%D7%9E%D7%A8%D7%95%D7%91%D7%93.pdf#page=204\" target=\"_blank\" rel=\"noreferrer\">רשות המסים · פקודת מס הכנסה [נוסח חדש], נוסח משולב (רשות המסים), עמוד 204, סעיף 125ג(ג)(1)-(2) <span class=\"out\">↗</span></a>\n    <p class=\"quote\">״שולמה הריבית על נכס שאינו צמוד למדד, או שהוא צמוד בחלקו לשיעור עליית המדד, כולו או חלקו, או שאינו צמוד למדד עד לפדיון או עד להחזר, תחויב הכנסתו של היחיד מריבית במס בשיעור של 15%״</p>\n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div>\n    <details class=\"more\"><summary>עוד <bdi dir=\"ltr\" class=\"n\">1</bdi> מקור</summary><div class=\"src\">\n    <a href=\"https://www.gov.il/BlobFolder/generalpage/income-tax-guide-knowyourright/he/Guides_IncomeTax_da-2025.pdf#page=42\" target=\"_blank\" rel=\"noreferrer\">רשות המסים · דע זכויותיך וחובותיך 2025, עמוד 42 <span class=\"out\">↗</span></a>\n    \n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div></details>\n  </article>","TXI-07":"<article class=\"card\" data-rule=\"TXI-07\">\n    <h3><bdi dir=\"ltr\" class=\"id\">TXI-07</bdi> · עיתוי: פיקדונות ותוכניות חיסכון ממוסים במשיכה, בניכוי במקור</h3>\n    <p class=\"text\">רווחים שנצברו בפיקדונות ובתוכניות חיסכון ממוסים בעת המשיכה. הבנק מנכה את המס במקור כשהוא משלם את הריבית ליחיד. אין כלל מיוחד לשבירת פיקדון: הבנק מנכה מהריבית שהוא משלם בפועל, ולכן בשבירה ממוסה רק הריבית ששולמה. כמה ריבית שבירה משלמת הוא תנאי של הבנק, וכדי שפיקדון ייחשב קצוב לעניין הנזילות, הוראת המפקח דורשת שמשיכה מוקדמת תגרור קנס גדול במידה מהותית מאובדן הריבית, כך ששבירה עלולה לפגוע גם בקרן; אם להפסד כזה יש משמעות לעניין המס, לא נאמר באף מקור.</p>\n    \n    <div class=\"src\">\n    <a href=\"https://www.gov.il/BlobFolder/generalpage/income-tax-guide-knowyourright/he/Guides_IncomeTax_da-2025.pdf#page=42\" target=\"_blank\" rel=\"noreferrer\">רשות המסים · דע זכויותיך וחובותיך 2025, עמוד 42, סעיפים 21-23 <span class=\"out\">↗</span></a>\n    <p class=\"quote\">״מחויבים במס בעת המשיכה״</p>\n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">26.10.2026</bdi></p>\n  </div>\n    <details class=\"more\"><summary>עוד <bdi dir=\"ltr\" class=\"n\">5</bdi> מקורות</summary><div class=\"src\">\n    <a href=\"https://www.boi.org.il/media/rvzi1ngd/151.pdf#page=6\" target=\"_blank\" rel=\"noreferrer\">בנק ישראל · כללי הבנקאות (שירות ללקוח) (גילוי נאות ומסירת מסמכים), התשנ״ב-1992, עמוד 6, סעיף 10(א) <span class=\"out\">↗</span></a>\n    \n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">26.10.2026</bdi></p>\n  </div><div class=\"src\">\n    <a href=\"https://boi.org.il/media/fdkmxbr0/221.pdf#page=20\" target=\"_blank\" rel=\"noreferrer\">בנק ישראל · הוראת ניהול בנקאי תקין 221: יחס כיסוי הנזילות (9/25), עמוד 20, סעיף 82 <span class=\"out\">↗</span></a>\n    <p class=\"quote\">״כרוכה בקנס משמעותי ששיעורו גדול מהותית מהפסד הריבית״</p>\n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">26.10.2026</bdi></p>\n  </div><div class=\"src\">\n    <a href=\"https://www.btl.gov.il/Laws1/02_0103_100269.pdf#page=2\" target=\"_blank\" rel=\"noreferrer\">שר האוצר (נוסח משולב באתר המוסד לביטוח לאומי) · תקנות מס הכנסה (ניכוי מריבית, מדיבידנד ומרווחים מסוימים), התשס״ו-2005, עמוד 2, תקנה 4 <span class=\"out\">↗</span></a>\n    \n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div><div class=\"src\">\n    <a href=\"https://www.btl.gov.il/Laws1/02_0103_100269.pdf#page=5\" target=\"_blank\" rel=\"noreferrer\">שר האוצר (נוסח משולב באתר המוסד לביטוח לאומי) · תקנות מס הכנסה (ניכוי מריבית, מדיבידנד ומרווחים מסוימים), התשס״ו-2005, עמוד 5, תקנה 20(א)(2)(ג) <span class=\"out\">↗</span></a>\n    \n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div><div class=\"src\">\n    <a href=\"https://bankhapoalim.co.il/sites/default/files/media/PDFS/standard-contract/ligal_deposit_contract_311223_ribit_kvua.pdf#page=1\" target=\"_blank\" rel=\"noreferrer\">בנק הפועלים · בנק הפועלים: פיקדון בריבית קבועה, תנאי עסקה, עמוד 1 <span class=\"out\">↗</span></a>\n    <p class=\"quote\">״ינכה הבנק מס הכנסה במקור״</p>\n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">26.10.2026</bdi></p>\n  </div></details>\n  </article>","TXS-21":"<article class=\"card\" data-rule=\"TXS-21\">\n    <h3><bdi dir=\"ltr\" class=\"id\">TXS-21</bdi> · מעבר בין קרנות או ניירות ערך הוא מכירה</h3>\n    <p class=\"text\">מכירה לפי הפקודה כוללת חליפין, ויתור, הסבה, העברה, הענקה, מתנה ופדיון, וכל אירוע אחר שבו נכס יוצא מרשותו של אדם, חוץ מירושה. לכן פדיון של קרן נאמנות אחת כדי לקנות אחרת, או מכירה של קרן סל או מניה כדי לקנות אחרת, הם מכירה, והמס על הרווח הריאלי מנוכה במקור גם אם הכסף לא יוצא מהחשבון. שר האוצר רשאי לקבוע מקרים שבהם רואים יחידה בקרן פטורה כנמכרת ונרכשת מחדש, אבל צו כזה לא נמצא. בקופות הגמל, בקרן ההשתלמות ובפנסיה, לעומת זאת, מעבר בין מסלולים או קופות אינו אירוע מס.</p>\n    \n    <div class=\"src\">\n    <a href=\"https://www.gov.il/BlobFolder/legalinfo/law_pkudat_mas_hachnasa/he/LegalInformation_kesher_%D7%A4%D7%A7%D7%95%D7%93%D7%AA%20%D7%9E%D7%A1%20%D7%94%D7%9B%D7%A0%D7%A1%D7%94%20%5B%D7%A0%D7%95%D7%A1%D7%97%20%D7%97%D7%93%D7%A9%5D%20-%20%D7%9C%D7%90%20%D7%9E%D7%A8%D7%95%D7%91%D7%93.pdf#page=148\" target=\"_blank\" rel=\"noreferrer\">רשות המסים · פקודת מס הכנסה [נוסח חדש], נוסח משולב (רשות המסים) <span class=\"out\">↗</span></a>\n    <p class=\"quote\">״לרבות חליפין, ויתור, הסבה, העברה, הענקה, מתנה, פדיון״</p>\n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div>\n    <details class=\"more\"><summary>עוד <bdi dir=\"ltr\" class=\"n\">1</bdi> מקור</summary><div class=\"src\">\n    <a href=\"https://www.gov.il/BlobFolder/legalinfo/law_pkudat_mas_hachnasa/he/LegalInformation_kesher_%D7%A4%D7%A7%D7%95%D7%93%D7%AA%20%D7%9E%D7%A1%20%D7%94%D7%9B%D7%A0%D7%A1%D7%94%20%5B%D7%A0%D7%95%D7%A1%D7%97%20%D7%97%D7%93%D7%A9%5D%20-%20%D7%9C%D7%90%20%D7%9E%D7%A8%D7%95%D7%91%D7%93.pdf#page=167\" target=\"_blank\" rel=\"noreferrer\">רשות המסים · פקודת מס הכנסה [נוסח חדש], נוסח משולב (רשות המסים), עמוד 167, סעיף 101א(א)(12) <span class=\"out\">↗</span></a>\n    <p class=\"quote\">״מקרים שבהם יראו יחידה בקרן נאמנות פטורה כנמכרת וכנרכשת מחדש״</p>\n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div></details>\n  </article>","TXS-09":"<article class=\"card\" data-rule=\"TXS-09\">\n    <h3><bdi dir=\"ltr\" class=\"id\">TXS-09</bdi> · קרן פטורה: מה החוסך משלם במכירה או בפדיון</h3>\n    <p class=\"text\">הרווח הריאלי של יחיד ממכירה או מפדיון של יחידה בקרן פטורה ממוסה לכל היותר בשיעור המס על הרווח הריאלי, כשלב הגבוה ביותר בסולם ההכנסה שלו, והבנק או חבר הבורסה מנכה אותו במקור מהרווח הריאלי. הרווח הריאלי נמדד מול מדד המחירים לצרכן ביחידות שקליות, מול שער המטבע ביחידות שנקובות במטבע חוץ או צמודות אליו, ומול המטבע העיקרי של הקרן בקרן להשקעות חוץ. הכלל נוגע לתושב ישראל שאינו בעל מניות מהותי, בלי הכנסה מעסק בניירות ערך ובלי הוצאות מימון; מס נוסף על הכנסות גבוהות הוא כלל נפרד, וגם גיל שישים ומעלה.</p>\n    <dl class=\"figs\"><div><dt>שיעור המס על הרווח הריאלי</dt><dd><span class=\"sourced\"><bdi dir=\"ltr\" class=\"n\">25</bdi></span> </dd></div></dl>\n    <div class=\"src\">\n    <a href=\"https://www.gov.il/BlobFolder/legalinfo/law_pkudat_mas_hachnasa/he/LegalInformation_kesher_%D7%A4%D7%A7%D7%95%D7%93%D7%AA%20%D7%9E%D7%A1%20%D7%94%D7%9B%D7%A0%D7%A1%D7%94%20%5B%D7%A0%D7%95%D7%A1%D7%97%20%D7%97%D7%93%D7%A9%5D%20-%20%D7%9C%D7%90%20%D7%9E%D7%A8%D7%95%D7%91%D7%93.pdf#page=151\" target=\"_blank\" rel=\"noreferrer\">רשות המסים · פקודת מס הכנסה [נוסח חדש], נוסח משולב (רשות המסים), עמוד 151, סעיף 91(ב)(1) <span class=\"out\">↗</span></a>\n    \n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div>\n    <details class=\"more\"><summary>עוד <bdi dir=\"ltr\" class=\"n\">2</bdi> מקורות</summary><div class=\"src\">\n    <a href=\"https://www.gov.il/BlobFolder/legalinfo/law_pkudat_mas_hachnasa/he/LegalInformation_kesher_%D7%A4%D7%A7%D7%95%D7%93%D7%AA%20%D7%9E%D7%A1%20%D7%94%D7%9B%D7%A0%D7%A1%D7%94%20%5B%D7%A0%D7%95%D7%A1%D7%97%20%D7%97%D7%93%D7%A9%5D%20-%20%D7%9C%D7%90%20%D7%9E%D7%A8%D7%95%D7%91%D7%93.pdf#page=152\" target=\"_blank\" rel=\"noreferrer\">רשות המסים · פקודת מס הכנסה [נוסח חדש], נוסח משולב (רשות המסים), עמוד 152, סעיף 91(ב1) <span class=\"out\">↗</span></a>\n    <p class=\"quote\">״במכירת יחידה בקרן נאמנות פטורה״</p>\n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div><div class=\"src\">\n    <a href=\"https://www.btl.gov.il/Laws1/02_0103_100228.pdf#page=1\" target=\"_blank\" rel=\"noreferrer\">שר האוצר (נוסח משולב באתר המוסד לביטוח לאומי) · תקנות מס הכנסה (ניכוי מתמורה, מתשלום או מרווח הון במכירת נייר ערך, במכירת יחידה בקרן נאמנות או בעסקה עתידית), התשס״ג-2002, עמוד 1, תקנה 3א <span class=\"out\">↗</span></a>\n    <p class=\"quote\">״בעל יחידה בקרן נאמנות פטורה, רווח הון ריאלי בשל מכירה או פדיון של יחידה, ינכה ממנו מס בשיעור של 25%״</p>\n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div></details>\n  </article>","BRK-16":"<article class=\"card\" data-rule=\"BRK-16\">\n    <h3><bdi dir=\"ltr\" class=\"id\">BRK-16</bdi> · בנקים: התעריפון המלא קובע את סוגי העמלות בניירות ערך</h3>\n    <p class=\"text\">התעריפון המלא של בנק בנוי לפי כללי הבנקאות בעניין עמלות, וחלק ניירות הערך שבו קובע את סוגי העמלות: קנייה, מכירה ופדיון של ניירות ערך בישראל ובחו&quot;ל, באחוזים עם מינימום ומקסימום ובנפרד למניות, לאיגרות חוב ולמק&quot;מ; דמי ניהול פיקדון ניירות ערך באחוזים עם מקסימום; העברת ניירות ערך; המרת ניירות; ושירותים מיוחדים כמו עמלת הפצה, השאלה לצורך מכירה בחסר ועמלת קסטודיאן, ובחלק המטבע חוץ עמלת החליפין. פקודה מפוצלת משלמת את המינימום פעם ביום, פקודה שלא בוצעה בגלל הלקוח משלמת מינימום רק אם ניתנה דרך פקיד, ופעולה ישירה באינטרנט מקבלת תעריף מופחת. הכללים קובעים את המבנה בלבד; המחירים הם של כל בנק, חוץ מהשירותים שמסומנים בפיקוח. אם בנק רשאי לגבות עמלה על ניירות ערך שאינה ברשימה לא כתוב בנוסח שנקרא.</p>\n    \n    <div class=\"src\">\n    <a href=\"https://www.boi.org.il/media/mi2driua/159a.pdf#page=3\" target=\"_blank\" rel=\"noreferrer\">בנק ישראל · כללי הבנקאות (שירות ללקוח) (עמלות), התשס״ח-2008, עמודים 3, 15 עד 18, סעיף 2(א) <span class=\"out\">↗</span></a>\n    \n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div>\n    \n  </article>","BANK-18":"<article class=\"card\" data-rule=\"BANK-18\">\n    <h3><bdi dir=\"ltr\" class=\"id\">BANK-18</bdi> · אין דמי משמרת על מק״ם וקרן כספית בבנק</h3>\n    <p class=\"text\">בתעריפון המלא, לצד סעיף דמי ניהול פיקדון ניירות ערך, כתוב שאסור לגבות דמי ניהול כאלה על מק״ם או על קרן כספית. עמלות קנייה, מכירה ופדיון עדיין חלות על מק״ם, ויש לו שורה נפרדת בתעריפון. זה חשוב כשמשווים פיקדון בנקאי לקרן כספית או למק״ם שקונים באותו בנק.</p>\n    \n    <div class=\"src\">\n    <a href=\"https://www.boi.org.il/media/mi2driua/159a.pdf#page=15\" target=\"_blank\" rel=\"noreferrer\">בנק ישראל · כללי הבנקאות (שירות ללקוח) (עמלות), התשס״ח-2008, עמודים 15 עד 17, התוספת הראשונה חלק 4, פרט 4(א)(5) <span class=\"out\">↗</span></a>\n    \n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div>\n    \n  </article>","PF-02":"<article class=\"card\" data-rule=\"PF-02\">\n    <h3><bdi dir=\"ltr\" class=\"id\">PF-02</bdi> · תקרת דמי הניהול לקופות גמל</h3>\n    <p class=\"text\">חברה מנהלת של קופת גמל רשאית לגבות מהיתרה הצבורה של כל עמית עד תקרת דמי הניהול השנתיים מהיתרה, ומהתשלומים שמועברים בעדו עד תקרת דמי הניהול מההפקדה. לעניין התקנה הזו 'קופת גמל' לא כוללת קרנות פנסיה, קרנות השתלמות, קופות בניהול אישי, קופות ענפיות ועוד, שלהן תקרות משלהן. לכסף מהפקדות של שנות מס ישנות הקופה רשאית לגבות במקום זאת סכום חודשי קבוע, צמוד למדד, שלא נקרא. למקבלי קצבה התקרה נמוכה יותר, ולמקבלי קצבת זקנה בפוליסות ביטוח מפברואר 2022 נמוכה עוד יותר.</p>\n    <dl class=\"figs\"><div><dt>תקרת דמי הניהול השנתיים מהיתרה</dt><dd><span class=\"sourced\"><bdi dir=\"ltr\" class=\"n\">1.05</bdi></span> </dd></div><div><dt>תקרת דמי הניהול מההפקדה</dt><dd><span class=\"sourced\"><bdi dir=\"ltr\" class=\"n\">4</bdi></span> </dd></div></dl>\n    <div class=\"src\">\n    <a href=\"https://free-justice.openapi.gov.il/free/moj/portal/rest/searchpredefinedapi/v1/SearchPredefinedApi/Documents/oKtbynDaWVkpXLh269S3D5emiZ9xy8ix+3WluIi8DJg=#page=4\" target=\"_blank\" rel=\"noreferrer\">רשומות (משרד המשפטים) · תקנות הפיקוח על שירותים פיננסיים (קופות גמל) (דמי ניהול), התשע&quot;ב-2012 (קובץ התקנות 7131), עמוד 4, תקנה 2(א)(1)-(3); 2(ב) <span class=\"out\">↗</span></a>\n    <p class=\"quote\">״מן היתרה הצבורה בחשבונו של כל עמית בשיעור שלא יעלה על 1.05% לשנה״</p>\n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">26.10.2026</bdi></p>\n  </div>\n    <details class=\"more\"><summary>עוד <bdi dir=\"ltr\" class=\"n\">4</bdi> מקורות</summary><div class=\"src\">\n    <a href=\"https://free-justice.openapi.gov.il/free/moj/portal/rest/searchpredefinedapi/v1/SearchPredefinedApi/Documents/8HBFRznZ1PqBBqBlhhXAb7L47e1dgbmyX~fXnBHkch8=#page=2\" target=\"_blank\" rel=\"noreferrer\">רשומות (משרד המשפטים) · תקנות הפיקוח על שירותים פיננסיים (קופות גמל) (דמי ניהול) (תיקון), התשפ&quot;ב-2022 (קובץ התקנות 9942), עמוד 2, סעיף 1 <span class=\"out\">↗</span></a>\n    <p class=\"quote\">״לעניין מקבלי קצבת זקנה בפוליסות ביטוח שהוצאו לפי קופות ביטוח״</p>\n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">26.10.2026</bdi></p>\n  </div><div class=\"src\">\n    <a href=\"https://free-justice.openapi.gov.il/free/moj/portal/rest/searchpredefinedapi/v1/SearchPredefinedApi/Documents/bfvsjLN+leExZ3ArqQksAeOdRzFXelp1D6CGA3tNK3g=#page=4\" target=\"_blank\" rel=\"noreferrer\">רשומות (משרד המשפטים) · תקנות הפיקוח על שירותים פיננסיים (קופות גמל) (דמי ניהול) (תיקון), התשע&quot;ד-2014 (קובץ התקנות 7358), עמוד 4, סעיף 2 <span class=\"out\">↗</span></a>\n    <p class=\"quote\">״לעניין עמית אשר באחד מחשבונותיו בקופת גמל שאינה קופת ביטוח״</p>\n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div><div class=\"src\">\n    <a href=\"https://free-justice.openapi.gov.il/free/moj/portal/rest/searchpredefinedapi/v1/SearchPredefinedApi/Documents/oKtbynDaWVkpXLh269S3D5emiZ9xy8ix+3WluIi8DJg=#page=6\" target=\"_blank\" rel=\"noreferrer\">רשומות (משרד המשפטים) · תקנות הפיקוח על שירותים פיננסיים (קופות גמל) (דמי ניהול), התשע&quot;ב-2012 (קובץ התקנות 7131), עמוד 6, תקנה 7 <span class=\"out\">↗</span></a>\n    \n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div><div class=\"src\">\n    <a href=\"https://free-justice.openapi.gov.il/free/moj/portal/rest/searchpredefinedapi/v1/SearchPredefinedApi/Documents/bfvsjLN+leExZ3ArqQksAeOdRzFXelp1D6CGA3tNK3g=#page=5\" target=\"_blank\" rel=\"noreferrer\">רשומות (משרד המשפטים) · תקנות הפיקוח על שירותים פיננסיים (קופות גמל) (דמי ניהול) (תיקון), התשע&quot;ד-2014 (קובץ התקנות 7358), עמוד 5, סעיף 8 <span class=\"out\">↗</span></a>\n    <p class=\"quote\">״יתעדכן ביום העסקים הראשון בכל שנה״</p>\n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div></details>\n  </article>","PF-06":"<article class=\"card\" data-rule=\"PF-06\">\n    <h3><bdi dir=\"ltr\" class=\"id\">PF-06</bdi> · תקרת דמי הניהול לקרן השתלמות ולניהול אישי</h3>\n    <p class=\"text\">חברה מנהלת של קרן השתלמות, קופה בניהול אישי, קופה מרכזית או קופה למטרה אחרת רשאית לגבות דמי ניהול מהיתרה הצבורה של כל עמית עד תקרת דמי הניהול השנתיים מהיתרה. התקנה מתירה דמי ניהול מהיתרה בלבד ואין בה סעיף של דמי ניהול מהפקדה, וחוזר הדוח השנתי של רשות שוק ההון מונה את קרן ההשתלמות ואת הקופה בניהול אישי בין הקופות שבהן אי אפשר לגבות דמי ניהול מהפקדה. קופות ענפיות גובות הוצאות בפועל בתוך התקרה.</p>\n    <dl class=\"figs\"><div><dt>תקרת דמי הניהול השנתיים מהיתרה</dt><dd><span class=\"sourced\"><bdi dir=\"ltr\" class=\"n\">2</bdi></span> </dd></div></dl>\n    <div class=\"src\">\n    <a href=\"https://www.gov.il/BlobFolder/dynamiccollectorresultitem/r_2020-9-22/he/2020-9-22.pdf#page=37\" target=\"_blank\" rel=\"noreferrer\">רשות שוק ההון, ביטוח וחיסכון · חוזר גופים מוסדיים 2020-9-22 – דוח שנתי ודוח רבעוני לעמיתים ולמבוטחים בגוף מוסדי – תיקון, עמוד 37 <span class=\"out\">↗</span></a>\n    <p class=\"quote\">״למעט במקרים בהם לא ניתן לגבות דמי ניהול מהפקדה כגון: קופה בניהול אישי, קרן השתלמות, קופה לפי הוצאות בפועל״</p>\n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">26.10.2026</bdi></p>\n  </div>\n    <details class=\"more\"><summary>עוד <bdi dir=\"ltr\" class=\"n\">1</bdi> מקור</summary><div class=\"src\">\n    <a href=\"https://free-justice.openapi.gov.il/free/moj/portal/rest/searchpredefinedapi/v1/SearchPredefinedApi/Documents/oKtbynDaWVkpXLh269S3D5emiZ9xy8ix+3WluIi8DJg=#page=6\" target=\"_blank\" rel=\"noreferrer\">רשומות (משרד המשפטים) · תקנות הפיקוח על שירותים פיננסיים (קופות גמל) (דמי ניהול), התשע&quot;ב-2012 (קובץ התקנות 7131), עמוד 6, תקנות 4, 5 <span class=\"out\">↗</span></a>\n    <p class=\"quote\">״רשאית לגבות דמי ניהול מיתרת הכספים הצבורה בחשבונו של כל עמית״</p>\n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div></details>\n  </article>","PF-17":"<article class=\"card\" data-rule=\"PF-17\">\n    <h3><bdi dir=\"ltr\" class=\"id\">PF-17</bdi> · העברת כסף בין קופות גמל: המסלולים המותרים</h3>\n    <p class=\"text\">משיכה והעברה מקופת גמל מותרות רק כפי שהחוק מונה, והתקנות קובעות את המסלולים. לקופת גמל לקצבה מעבירים מקופת קצבה אחרת, מקופת תגמולים או פיצויים אם הקופה המקבלת משלמת קצבה, מקרן השתלמות אם העמית יכול למשוך בפטור, ומקופת גמל להשקעה מגיל הפרישה המוקדמת. לקופה שאינה לקצבה: תגמולים לתגמולים, פיצויים לפיצויים, קרן השתלמות לקרן השתלמות, קופת גמל להשקעה לקופת גמל להשקעה אחרת, ואחרת רק באישור הממונה. מסלול מקרן השתלמות או מתגמולים לקופת גמל להשקעה, או ממנה לקרן השתלמות, לא נמצא; ההעברה חסומה כשיש עיקול או שעבוד על כל היתרה, הלוואה פתוחה, קצבה שהתחילה, או קופה מקבלת סגורה.</p>\n    \n    <div class=\"src\">\n    <a href=\"https://free-justice.openapi.gov.il/free/moj/portal/rest/searchpredefinedapi/v1/SearchPredefinedApi/Documents/dDKkjTfMz0H3iRxP7u8fpoeVB94OXb~VXxIiNxEmuFE=#page=4\" target=\"_blank\" rel=\"noreferrer\">רשומות (משרד המשפטים) · תקנות הפיקוח על שירותים פיננסיים (קופות גמל) (העברת כספים בין קופות גמל), התשס&quot;ח-2008 (קובץ התקנות 6657) <span class=\"out\">↗</span></a>\n    <p class=\"quote\">״העברת כספים לקופת גמל לקצבה״</p>\n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div>\n    <details class=\"more\"><summary>עוד <bdi dir=\"ltr\" class=\"n\">5</bdi> מקורות</summary><div class=\"src\">\n    <a href=\"https://free-justice.openapi.gov.il/free/moj/portal/rest/searchpredefinedapi/v1/SearchPredefinedApi/Documents/dDKkjTfMz0H3iRxP7u8fpoeVB94OXb~VXxIiNxEmuFE=#page=5\" target=\"_blank\" rel=\"noreferrer\">רשומות (משרד המשפטים) · תקנות הפיקוח על שירותים פיננסיים (קופות גמל) (העברת כספים בין קופות גמל), התשס&quot;ח-2008 (קובץ התקנות 6657), עמוד 5, תקנה 3(א) <span class=\"out\">↗</span></a>\n    <p class=\"quote\">״ניתן להעביר כספים מקופת גמל אחת לקופת גמל אחרת שאינה קופת גמל לקצבה״</p>\n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div><div class=\"src\">\n    <a href=\"https://free-justice.openapi.gov.il/free/moj/portal/rest/searchpredefinedapi/v1/SearchPredefinedApi/Documents/dDKkjTfMz0H3iRxP7u8fpoeVB94OXb~VXxIiNxEmuFE=#page=6\" target=\"_blank\" rel=\"noreferrer\">רשומות (משרד המשפטים) · תקנות הפיקוח על שירותים פיננסיים (קופות גמל) (העברת כספים בין קופות גמל), התשס&quot;ח-2008 (קובץ התקנות 6657), עמוד 6, תקנה 4 <span class=\"out\">↗</span></a>\n    <p class=\"quote\">״לא ניתן להעביר כספים מקופה מעבירה לקופה מקבלת במקרים אלה״</p>\n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div><div class=\"src\">\n    <a href=\"https://free-justice.openapi.gov.il/free/moj/portal/rest/searchpredefinedapi/v1/SearchPredefinedApi/Documents/bfvsjLN+leExZ3ArqQksAZbYNmyK9Qa3gH~lF+jEWmc=#page=3\" target=\"_blank\" rel=\"noreferrer\">רשומות (משרד המשפטים) · תקנות הפיקוח על שירותים פיננסיים (קופות גמל) (העברת כספים בין קופות גמל) (תיקון), התשע&quot;ד-2014 (קובץ התקנות 7407), עמוד 3, סעיפים 2-3 <span class=\"out\">↗</span></a>\n    \n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div><div class=\"src\">\n    <a href=\"https://free-justice.openapi.gov.il/free/moj/portal/rest/searchpredefinedapi/v1/SearchPredefinedApi/Documents/tZDvucD9RCpb4OFgftW2Mghx2FA7HU11Svr+ngxOA9o=#page=2\" target=\"_blank\" rel=\"noreferrer\">רשומות (משרד המשפטים) · תקנות הפיקוח על שירותים פיננסיים (קופות גמל) (העברת כספים בין קופות גמל) (תיקון), התש&quot;ף-2020 (קובץ התקנות 8735), עמוד 2 <span class=\"out\">↗</span></a>\n    <p class=\"quote\">״מקופת גמל להשקעה לקופת גמל להשקעה אחרת״</p>\n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div><div class=\"src\">\n    <a href=\"https://fs.knesset.gov.il/16/law/16_lsr_299984.pdf#page=11\" target=\"_blank\" rel=\"noreferrer\">הכנסת · חוק הפיקוח על שירותים פיננסיים (קופות גמל), התשס&quot;ה-2005, עמוד 11, סעיף 23(א)(2), 23(ב) <span class=\"out\">↗</span></a>\n    <p class=\"quote\">״תהיה כמפורט להלן, בלבד״</p>\n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div></details>\n  </article>","PF-23":"<article class=\"card\" data-rule=\"PF-23\">\n    <h3><bdi dir=\"ltr\" class=\"id\">PF-23</bdi> · מעבר מסלול: תוך ימי עסקים ספורים, בלי עמלה</h3>\n    <p class=\"text\">כסף עובר ממסלול השקעה למסלול אחר באותה קופה בתוך ימי העסקים למעבר מסלול, אלא אם התקנון קובע תקופה קצרה יותר. בקופת גמל להשקעה, שהתקנה לא נוקבת בה, את הזכות ואת המועד קובע התקנון התקני של רשות שוק ההון: מותר להעביר כסף ממסלול אחד או מכמה מסלולים לאחרים, באותו מספר ימים, ואם המועד נופל בשלושת ימי העסקים הראשונים של החודש החברה רשאית לדחות אותו ליום העסקים הרביעי; אפשר גם להפקיד לכל מסלול. אין עמלה ואין הגבלה על מספר המעברים, אבל מעבר יכול לסיים הנחה בדמי ניהול מוקדם.</p>\n    <dl class=\"figs\"><div><dt>ימי עסקים למעבר מסלול</dt><dd><span class=\"sourced\"><bdi dir=\"ltr\" class=\"n\">3</bdi></span> </dd></div></dl>\n    <div class=\"src\">\n    <a href=\"https://www.gov.il/BlobFolder/dynamiccollectorresultitem/notice-2022-9-30/he/management-of-investment-tracks-in-a-provident-fund_pdf.pdf#page=4\" target=\"_blank\" rel=\"noreferrer\">רשות שוק ההון, ביטוח וחיסכון · חוזר גופים מוסדיים 2022-9-30: מסלולי השקעה בקופות גמל – תיקון, עמוד 4, סעיף 4(ד)(3) <span class=\"out\">↗</span></a>\n    <p class=\"quote\">״זכותו של כל עמית להעביר בכל עת את כספיו, כולם או חלקם, מכל מסלול לכל מסלול אחר באותה הקופה״</p>\n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">26.10.2026</bdi></p>\n  </div>\n    <details class=\"more\"><summary>עוד <bdi dir=\"ltr\" class=\"n\">3</bdi> מקורות</summary><div class=\"src\">\n    <a href=\"https://www.gov.il/BlobFolder/dynamiccollectorresultitem/regulation-2829/he/regulation_hm_takanongemel.pdf#page=5\" target=\"_blank\" rel=\"noreferrer\">רשות שוק ההון, ביטוח וחיסכון · תקנון תקני לקופת גמל להשקעה (רשות שוק ההון, ביטוח וחיסכון, 29.9.2016), עמוד 5, סעיף 10; עמוד 6, סעיף 20.1; עמוד 7, סעיפים 20.2-20.4 <span class=\"out\">↗</span></a>\n    <p class=\"quote\">״אם חל מועד העברת הכספים באחד משלושת ימי העסקים הראשונים בחודש פלוני, רשאית החברה המנהלת לדחות את מועד העברת הכספים ליום העסקים הרביעי באותו חודש״</p>\n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">26.10.2026</bdi></p>\n  </div><div class=\"src\">\n    <a href=\"https://www.btl.gov.il/Laws1/02_0103_100022.pdf#page=9\" target=\"_blank\" rel=\"noreferrer\">שר האוצר (נוסח משולב באתר המוסד לביטוח לאומי) · תקנות מס הכנסה (כללים לאישור ולניהול קופות גמל), התשכ״ד-1964, עמוד 9, תקנה 33ב(א)-(ב) <span class=\"out\">↗</span></a>\n    <p class=\"quote\">״בתוך שלושה ימי עסקים, אלא אם כן נקבעה בתקנון הקופה תקופה קצרה יותר״</p>\n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div><div class=\"src\">\n    <a href=\"https://www.btl.gov.il/Laws1/02_0103_100022.pdf#page=3\" target=\"_blank\" rel=\"noreferrer\">שר האוצר (נוסח משולב באתר המוסד לביטוח לאומי) · תקנות מס הכנסה (כללים לאישור ולניהול קופות גמל), התשכ״ד-1964, עמוד 3, תקנה 1 (מסלול השקעה) <span class=\"out\">↗</span></a>\n    \n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div></details>\n  </article>","BANK-06":"<article class=\"card\" data-rule=\"BANK-06\">\n    <h3><bdi dir=\"ltr\" class=\"id\">BANK-06</bdi> · שבירת פיקדון: הסכמת הבנק, הטופס והעלות</h3>\n    <p class=\"text\">אם ההסכם מאפשר למשוך את הפיקדון שלא במועדים שנקבעו, הבקשה מוגשת בטופס ייעודי שמראה את המועד הקרוב ביותר שבו אפשר למשוך בלי לשבור את הפיקדון, וגם את השינויים בתנאים המקוריים שהמשיכה המוקדמת גוררת או את עקרונות השבירה של אותו סוג פיקדון. אם שבירה לא סוכמה מראש והבנק מסכים לה, הטופס מפרט את השינויים בתנאים או את עקרונות השבירה, ואין חובה לפרט את התוצאות המדויקות לפיקדון המסוים. בלוח הריביות המרוכז כל סוג פיקדון מקובל מסומן: אפשר לשבור בלי קנס, אפשר לשבור עם קנס ותיאור מנגנון הקנס, או אי אפשר לשבור. האם אפשר לשבור ומה הקנס הם תנאי מוצר שכל בנק קובע ומפרסם בלוח הזה. הוראת הנזילות של המפקח על הבנקים מתייחסת לפיקדון קמעונאי לזמן קצוב כקצוב רק אם אין זכות למשוך אותו בתוך שלושים יום, או שמשיכה מוקדמת גוררת קנס גדול במידה מהותית מאובדן הריבית; המחיר עצמו נקבע בכל בנק.</p>\n    \n    <div class=\"src\">\n    <a href=\"https://www.boi.org.il/media/rvzi1ngd/151.pdf#page=6\" target=\"_blank\" rel=\"noreferrer\">בנק ישראל · כללי הבנקאות (שירות ללקוח) (גילוי נאות ומסירת מסמכים), התשנ״ב-1992, עמוד 6, סעיף 10(א)-(ב) <span class=\"out\">↗</span></a>\n    <p class=\"quote\">״ואין צורך לפרט את התוצאות המדוייקות הנוגעות לפקדון המסויים״</p>\n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">26.10.2026</bdi></p>\n  </div>\n    <details class=\"more\"><summary>עוד <bdi dir=\"ltr\" class=\"n\">2</bdi> מקורות</summary><div class=\"src\">\n    <a href=\"https://boi.org.il/media/fdkmxbr0/221.pdf#page=20\" target=\"_blank\" rel=\"noreferrer\">בנק ישראל · הוראת ניהול בנקאי תקין 221: יחס כיסוי הנזילות (9/25), עמוד 20, סעיף 82, סעיף 83 <span class=\"out\">↗</span></a>\n    <p class=\"quote\">״כרוכה בקנס משמעותי ששיעורו גדול מהותית מהפסד הריבית״</p>\n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">26.10.2026</bdi></p>\n  </div><div class=\"src\">\n    <a href=\"https://www.boi.org.il/media/orgfwntb/447.pdf#page=3\" target=\"_blank\" rel=\"noreferrer\">בנק ישראל · הוראת ניהול בנקאי תקין 447: פרסום שיעורי ריבית על פיקדונות ועל יתרות זכות בחשבון (5/24), עמוד 3, נספח א <span class=\"out\">↗</span></a>\n    <p class=\"quote\">״אפשרות לשבירת פיקדון״</p>\n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div></details>\n  </article>","PF-19":"<article class=\"card\" data-rule=\"PF-19\">\n    <h3><bdi dir=\"ltr\" class=\"id\">PF-19</bdi> · מועד ההעברה, פיצוי על איחור, ואין עמלת העברה</h3>\n    <p class=\"text\">הקופה המעבירה מעבירה את היתרה בתוך ימי העסקים להעברה בין קופות מהיום שקיבלה בקשה מפורטת, חתומה ומלאה, והממונה רשאי להאריך במקרים מיוחדים. אם איחרה, היא משלמת לקופה המקבלת ריבית פיגורים מתוך דמי הניהול שהיא גובה, ואת הפרש התשואה אם הוא גדול יותר, לזכות העמית; אם הקופה המקבלת איחרה, היא מזכה את העמית מדמי הניהול שלה. ההעברה נעשית ישירות בין הגופים ולא דרך העמית. התקנות לא קובעות עמלת העברה, וביחד עם הכלל על רשימת החיובים הסגורה, עמלת העברה אינה חיוב מותר; העברה החוצה יכולה לסיים הנחה מוקדם.</p>\n    <dl class=\"figs\"><div><dt>ימי עסקים להעברה בין קופות</dt><dd><span class=\"sourced\"><bdi dir=\"ltr\" class=\"n\">10</bdi></span> </dd></div></dl>\n    <div class=\"src\">\n    <a href=\"https://free-justice.openapi.gov.il/free/moj/portal/rest/searchpredefinedapi/v1/SearchPredefinedApi/Documents/dDKkjTfMz0H3iRxP7u8fpoeVB94OXb~VXxIiNxEmuFE=#page=6\" target=\"_blank\" rel=\"noreferrer\">רשומות (משרד המשפטים) · תקנות הפיקוח על שירותים פיננסיים (קופות גמל) (העברת כספים בין קופות גמל), התשס&quot;ח-2008 (קובץ התקנות 6657), עמוד 6, תקנה 5(א)-(ב) <span class=\"out\">↗</span></a>\n    <p class=\"quote\">״בתוך עשרה ימי עסקים מהיום שבו הועברה לו בקשת העברה מפורטת, חתומה ומלאה״</p>\n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div>\n    <details class=\"more\"><summary>עוד <bdi dir=\"ltr\" class=\"n\">2</bdi> מקורות</summary><div class=\"src\">\n    <a href=\"https://free-justice.openapi.gov.il/free/moj/portal/rest/searchpredefinedapi/v1/SearchPredefinedApi/Documents/dDKkjTfMz0H3iRxP7u8fpoeVB94OXb~VXxIiNxEmuFE=#page=7\" target=\"_blank\" rel=\"noreferrer\">רשומות (משרד המשפטים) · תקנות הפיקוח על שירותים פיננסיים (קופות גמל) (העברת כספים בין קופות גמל), התשס&quot;ח-2008 (קובץ התקנות 6657) <span class=\"out\">↗</span></a>\n    <p class=\"quote\">״העברת כספים בין קופות תתבצע ישירות בין הגופים המנהלים של הקופות״</p>\n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div><div class=\"src\">\n    <a href=\"https://free-justice.openapi.gov.il/free/moj/portal/rest/searchpredefinedapi/v1/SearchPredefinedApi/Documents/bfvsjLN+leExZ3ArqQksAZbYNmyK9Qa3gH~lF+jEWmc=#page=4\" target=\"_blank\" rel=\"noreferrer\">רשומות (משרד המשפטים) · תקנות הפיקוח על שירותים פיננסיים (קופות גמל) (העברת כספים בין קופות גמל) (תיקון), התשע&quot;ד-2014 (קובץ התקנות 7407), עמוד 4, סעיף 4 <span class=\"out\">↗</span></a>\n    <p class=\"quote\">״יזקוף הגוף המנהל של הקופה המקבלת״</p>\n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div></details>\n  </article>","REG-18":"<article class=\"card\" data-rule=\"REG-18\">\n    <h3><bdi dir=\"ltr\" class=\"id\">REG-18</bdi> · נכסי קופות הגמל והפנסיה: בנאמנות, בנפרד, לא לעיקול</h3>\n    <p class=\"text\">חברה מנהלת משמשת נאמן על נכסי קופות הגמל שבניהולה לטובת העמיתים, ומחזיקה ומנהלת אותם בנפרד מרכושה, עם מערכת חשבונות נפרדת לכל קופה. נכסי קופת גמל אינם ניתנים לעיקול, וזכויות עמית לא ניתנות לעיקול אלא לפי כללים שהשר קובע. חל על כל הקופות שבפיקוח רשות שוק ההון; הפסדי שוק אינם מוגנים. לחיסכון לכל ילד בקופת גמל יש כלל נפרד.</p>\n    \n    <div class=\"src\">\n    <a href=\"https://fs.knesset.gov.il/16/law/16_lsr_299984.pdf#page=4\" target=\"_blank\" rel=\"noreferrer\">הכנסת · חוק הפיקוח על שירותים פיננסיים (קופות גמל), התשס&quot;ה-2005 (ספר החוקים 2024), עמוד 4, סעיף 3; עמוד 11, סעיף 25; עמוד 12, סעיפים 27, 30(א) <span class=\"out\">↗</span></a>\n    \n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div>\n    \n  </article>","REG-19":"<article class=\"card\" data-rule=\"REG-19\">\n    <h3><bdi dir=\"ltr\" class=\"id\">REG-19</bdi> · אם חברה מנהלת קורסת: הניהול עובר לחברה אחרת</h3>\n    <p class=\"text\">הוראות חוק הפיקוח על הביטוח על מנהל מורשה כשמבטח אינו יכול לעמוד בהתחייבויותיו חלות גם על חברות מנהלות, והממונה רשאי להורות גם על העברת ניהול קופת גמל לחברה מנהלת אחרת. אם מונה לחברה כונס נכסים זמני או מפרק והצו לא בוטל בתוך התקופה שבחוק (או תקופה ארוכה יותר שהממונה קובע), החברה חייבת להעביר את הניהול לחברה מנהלת אחרת כפי שהממונה מורה, ואם לא, הממונה משתמש בסמכויותיו. העברה מרצון דורשת אישור מראש של הממונה.</p>\n    \n    <div class=\"src\">\n    <a href=\"https://fs.knesset.gov.il/16/law/16_lsr_299984.pdf#page=15\" target=\"_blank\" rel=\"noreferrer\">הכנסת · חוק הפיקוח על שירותים פיננסיים (קופות גמל), התשס&quot;ה-2005 (ספר החוקים 2024), עמוד 15, סעיפים 39, 41, 42 <span class=\"out\">↗</span></a>\n    \n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div>\n    <details class=\"more\"><summary>עוד <bdi dir=\"ltr\" class=\"n\">2</bdi> מקורות</summary><div class=\"src\">\n    <a href=\"https://fs.knesset.gov.il/9/law/9_lsr_209334.PDF#page=15\" target=\"_blank\" rel=\"noreferrer\">הכנסת · חוק הפיקוח על עסקי ביטוח, התשמ&quot;א-1981 (פרסום מקורי ברשומות), עמודים 15 עד 16, סעיפים 68, 70 <span class=\"out\">↗</span></a>\n    \n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div><div class=\"src\">\n    <a href=\"https://fs.knesset.gov.il/20/law/20_lsr_348687.pdf#page=2\" target=\"_blank\" rel=\"noreferrer\">הכנסת · חוק הפיקוח על שירותים פיננסיים (תיקוני חקיקה), התשע&quot;ו-2016, עמוד 2, סעיף 1(1) (המפקח → הממונה) <span class=\"out\">↗</span></a>\n    \n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div></details>\n  </article>","REG-04":"<article class=\"card\" data-rule=\"REG-04\">\n    <h3><bdi dir=\"ltr\" class=\"id\">REG-04</bdi> · אין ביטוח פיקדונות; החוק מחייב בחינה</h3>\n    <p class=\"text\">אף חוק לא מקים ביטוח פיקדונות. החוק לקידום התחרות בשוק הבנקאות מחייב את שר האוצר ואת הנגיד לבחון אם מתקיימות נסיבות או תנאים שמקימים צורך בביטוח פיקדונות הציבור בתאגידים בנקאיים או בסוג מסוים מהם, ואם כן, איך ההסדר צריך לעבוד. הבחינה חייבת להסתיים בתוך תקופת הבחינה מיום התחילה, עם דוח התקדמות לוועדות הכנסת באמצע התקופה והמלצה בסופה. מועד התחילה עצמו לא נמצא בנוסח שנקרא, ומאגר הכנסת מסמן את החוק כתקף מיום פרסומו; לפי מקור משני, צוות הבחינה טרם הוקם במועד מכתב שנשלח כמה חודשים אחרי הפרסום.</p>\n    <dl class=\"figs\"><div><dt>חודשים מיום התחילה להשלמת הבחינה</dt><dd><span class=\"sourced\"><bdi dir=\"ltr\" class=\"n\">12</bdi></span> </dd></div><div><dt>חודשים מיום התחילה לדוח ההתקדמות</dt><dd><span class=\"sourced\"><bdi dir=\"ltr\" class=\"n\">6</bdi></span> </dd></div></dl>\n    <div class=\"src\">\n    <a href=\"https://boi.org.il/media/5folwk5o/119.pdf#page=2\" target=\"_blank\" rel=\"noreferrer\">בנק ישראל · חוק לקידום התחרות בשוק הבנקאות (תיקוני חקיקה), התשפ&quot;ו-2026 (נוסח בנק ישראל, 1.7.2026) <span class=\"out\">↗</span></a>\n    \n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div>\n    <details class=\"more\"><summary>עוד <bdi dir=\"ltr\" class=\"n\">2</bdi> מקורות</summary><div class=\"src\">\n    <a href=\"https://fs.knesset.gov.il/25/law/25_lsr_12224370.pdf#page=60\" target=\"_blank\" rel=\"noreferrer\">הכנסת · חוק התוכנית הכלכלית (תיקוני חקיקה ליישום המדיניות הכלכלית לשנת התקציב 2026), התשפ״ו-2026 (ספר החוקים 3510), עמוד 60 <span class=\"out\">↗</span></a>\n    \n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div><div class=\"src\">\n    <a href=\"https://knesset.gov.il/Odata/ParliamentInfo.svc/KNS_IsraelLaw()?$filter=substringof('התחרות%20בשוק%20הבנקאות',Name)&amp;$format=json\" target=\"_blank\" rel=\"noreferrer\">הכנסת ·  <span class=\"out\">↗</span></a>\n    \n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div></details>\n  </article>","REG-06":"<article class=\"card\" data-rule=\"REG-06\">\n    <h3><bdi dir=\"ltr\" class=\"id\">REG-06</bdi> · אם בנק קורס: ערבות לפי שיקול דעת, מנהל מורשה</h3>\n    <p class=\"text\">אם הנגיד, אחרי התייעצות עם המפקח, מוצא שבנק אינו יכול לעמוד בהתחייבויותיו או שיש חשש ממשי לכך, הוא רשאי למנות מנהל מורשה, מפקח מיוחד או ועדת ניהול. המנהל המורשה רשאי, באישור הנגיד, להעביר את נכסי הבנק והתחייבויותיו, כולם או חלקם, לרבות במכירת אמצעי השליטה. הנגיד, באישור הממשלה, רשאי (לא חייב) להכריז שבנק ישראל או בנק אחר שמסכים ערב לפיקדונות בבנק שניתן לגביו צו כזה, על כל הפיקדונות או עד סכום לפי סוג פיקדון, כשהאינטרס הציבורי מחייב זאת; ערבות כזו ניתנת לביטול בהודעה מראש של תקופת ההודעה לפחות. לא נמצא בפקודה כלל של עדיפות למפקידים, הפחתת חוב או בנק גישור.</p>\n    <dl class=\"figs\"><div><dt>ימי הודעה מראש לביטול ערבות</dt><dd><span class=\"sourced\"><bdi dir=\"ltr\" class=\"n\">90</bdi></span> ימים</dd></div></dl>\n    <div class=\"src\">\n    <a href=\"https://boi.org.il/media/s5ub1z12/103.pdf#page=6\" target=\"_blank\" rel=\"noreferrer\">בנק ישראל · פקודת הבנקאות, 1941 (קובץ חקיקה בנקאית של בנק ישראל, פריט 103), עמוד 6, סעיף 8ד ; עמוד 8, סעיף 8ו; עמוד 10, סעיף 8יא <span class=\"out\">↗</span></a>\n    \n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div>\n    <details class=\"more\"><summary>עוד <bdi dir=\"ltr\" class=\"n\">1</bdi> מקור</summary><div class=\"src\">\n    <a href=\"https://fs.knesset.gov.il/25/law/25_lsr_12224370.pdf#page=49\" target=\"_blank\" rel=\"noreferrer\">הכנסת · חוק התוכנית הכלכלית (תיקוני חקיקה ליישום המדיניות הכלכלית לשנת התקציב 2026), התשפ״ו-2026 (ספר החוקים 3510) <span class=\"out\">↗</span></a>\n    \n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div></details>\n  </article>","IRA-11":"<article class=\"card\" data-rule=\"IRA-11\">\n    <h3><bdi dir=\"ltr\" class=\"id\">IRA-11</bdi> · במה מותר להשקיע בניהול אישי</h3>\n    <p class=\"text\">מותר להשקיע רק בניירות ערך סחירים, פיקדונות, מוצרים מובנים, מטבע חוץ, יחידות בקרן נאמנות וקרנות חוץ, ורק בישראל ובמדינת חוץ מאושרת: לפי כללי ההשקעה של הגופים המוסדיים, מדינה בדירוג השקעה או מדינה החברה בארגון ה־OECD. טיוטת תיקון תבטל מוצרים מובנים ותצמצם את הגדרת קרן חוץ.</p>\n    \n    <div class=\"src\">\n    <a href=\"https://free-justice.openapi.gov.il/free/moj/portal/rest/searchpredefinedapi/v1/SearchPredefinedApi/Documents/aA+Qh3g77QNmRelSc3xeJ0cYncnL0AKU6J5OI6GlOZQ=#page=3\" target=\"_blank\" rel=\"noreferrer\">רשומות (משרד המשפטים) · תקנות הפיקוח על שירותים פיננסיים (קופות גמל) (קופת גמל בניהול אישי), התש&quot;ע-2009 (קובץ התקנות 6820), עמוד 3, תקנה 5(א)(1) <span class=\"out\">↗</span></a>\n    <p class=\"quote\">״בפיקדונות״</p>\n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div>\n    <details class=\"more\"><summary>עוד <bdi dir=\"ltr\" class=\"n\">3</bdi> מקורות</summary><div class=\"src\">\n    <a href=\"https://free-justice.openapi.gov.il/free/moj/portal/rest/searchpredefinedapi/v1/SearchPredefinedApi/Documents/YWZP5bJenUsJq8XlM540e3hb~slMjpWNpg18mW8KtBk=#page=2\" target=\"_blank\" rel=\"noreferrer\">רשומות (משרד המשפטים) · תקנות הפיקוח על שירותים פיננסים (קופות גמל) (קופת גמל בניהול אישי) (תיקון), התשע&quot;ז-2017 (קובץ התקנות 7819), עמוד 2, סעיף 1 <span class=\"out\">↗</span></a>\n    <p class=\"quote\">״מדינת חוץ מאושרת״</p>\n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div><div class=\"src\">\n    <a href=\"https://free-justice.openapi.gov.il/free/moj/portal/rest/searchpredefinedapi/v1/SearchPredefinedApi/Documents/YWZP5bJenUsJq8XlM540e3hb~slMjpWNpg18mW8KtBk=#page=4\" target=\"_blank\" rel=\"noreferrer\">רשומות (משרד המשפטים) · תקנות הפיקוח על שירותים פיננסים (קופות גמל) (קופת גמל בניהול אישי) (תיקון), התשע&quot;ז-2017 (קובץ התקנות 7819), עמוד 4, סעיף 4(1) (תקנה 5(א)(1)) <span class=\"out\">↗</span></a>\n    <p class=\"quote\">״במוצרים מובנים, במטבע חוץ״</p>\n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div><div class=\"src\">\n    <a href=\"https://he.wikisource.org/wiki/תקנות_הפיקוח_על_שירותים_פיננסיים_(קופות_גמל)_(כללי_השקעה_החלים_על_גופים_מוסדיים)\" target=\"_blank\" rel=\"noreferrer\">ויקיטקסט · , תקנה 1 <span class=\"out\">↗</span></a>\n    <p class=\"quote\">״מדינת חוץ מאושרת״</p>\n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div></details>\n  </article>","BANK-15":"<article class=\"card\" data-rule=\"BANK-15\">\n    <h3><bdi dir=\"ltr\" class=\"id\">BANK-15</bdi> · מוצרי שוק הכסף: פיקדונות, קרנות כספיות ומק״ם יחד</h3>\n    <p class=\"text\">בנק שדרכו אפשר לרכוש קרנות כספיות או מק״ם חייב לפרסם מידע מרוכז על פיקדונות, קרנות כספיות ומק״ם יחד, תחת הכותרת 'מוצרי שוק הכסף'. הסינון הראשון הוא תקופת ההשקעה והמטבע, אין להעדיף מוצר אחד על אחר, והבנק חייב להסביר איך קונים קרנות ומק״ם. נתוני הקרנות והמק״ם מתעדכנים לפחות פעם ביום, ובאזור האישי הלקוח רואה את כל אחזקותיו בשלושת המוצרים יחד. התשואה הצפויה של קרן היא הערכת המנהל, לא הבטחה, לפני מס ועמלות בנק; בחירה בתקופה מעל שנה לא מציגה קרנות ומק״ם.</p>\n    \n    <div class=\"src\">\n    <a href=\"https://boi.org.il/media/gcmk52bw/447a.pdf#page=1\" target=\"_blank\" rel=\"noreferrer\">בנק ישראל · הוראת ניהול בנקאי תקין 447א: פרסום מידע מרוכז על קרנות כספיות ומק&quot;מ (04/25) <span class=\"out\">↗</span></a>\n    \n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div>\n    <details class=\"more\"><summary>עוד <bdi dir=\"ltr\" class=\"n\">4</bdi> מקורות</summary><div class=\"src\">\n    <a href=\"https://boi.org.il/media/rall4hl2/h2813.pdf#page=2\" target=\"_blank\" rel=\"noreferrer\">בנק ישראל · חוזר הפיקוח על הבנקים ח-2813-06 (9.4.2025), עמודים 2 עד 4, סעיף 5-12 <span class=\"out\">↗</span></a>\n    \n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div><div class=\"src\">\n    <a href=\"https://boi.org.il/media/1gmhymzy/202511.pdf#page=1\" target=\"_blank\" rel=\"noreferrer\">בנק ישראל · דוח קביעת אסדרה: פרסום מידע מרוכז על קרנות כספיות ומק&quot;מ (7.4.2025), עמודים 1 עד 7 <span class=\"out\">↗</span></a>\n    \n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div><div class=\"src\">\n    <a href=\"https://www.boi.org.il/media/pcuny0hd/עמדת-בנק-ישראל-בנוגע-להכרזת-הממונה-על-התחרות-על-חמש-הקבוצות-הבנקאיות-כקבוצת-ריכוז-ומתן-הוראות-בתחום-הפיקדונות.pdf#page=1\" target=\"_blank\" rel=\"noreferrer\">בנק ישראל · בנק ישראל, הודעה לעיתונות 6.5.2026: עמדת בנק ישראל בנוגע להכרזת הממונה על התחרות, עמוד 1 <span class=\"out\">↗</span></a>\n    \n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div><div class=\"src\">\n    <a href=\"https://www.funder.co.il/article/188090\" target=\"_blank\" rel=\"noreferrer\">פאנדר · פאנדר, 25.9.2025: פרסום מידע מרוכז על קרנות כספיות ומק&quot;מ (דחייה) <span class=\"out\">↗</span></a>\n    \n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div></details>\n  </article>","MF-32":"<article class=\"card\" data-rule=\"MF-32\">\n    <h3><bdi dir=\"ltr\" class=\"id\">MF-32</bdi> · קרן כספית: מטבע וקרנות ללא קונצרני</h3>\n    <p class=\"text\">אם קרן כספית מחזיקה נכסים צמודים לשער מטבע, כולם חייבים להיות צמודים לאותו מטבע, הפיקדונות והמזומן שלה חייבים להיות באותו מטבע, והיא לא רשאית להחזיק נכסים לא צמודים. אם היא מחזיקה נכסים לא צמודים, הפיקדונות והמזומן חייבים להיות בשקלים בלבד. קרן כספית ללא קונצרני לא רשאית להחזיק ניירות ערך שלא הנפיקה המדינה. בהוראת התצוגה של בנק ישראל, קרן כספית מט״ח היא קרן ששיעור החשיפה המרבי שלה למטבע חוץ אינו אפס, או שהיא נקובה במטבע חוץ.</p>\n    \n    <div class=\"src\">\n    <a href=\"https://www.new.isa.gov.il/images/Fittings/isa/asset_library_pic/al_lobby/al_lobby-62bd445f910eb/MoneyMarketFundReg24.pdf#page=26\" target=\"_blank\" rel=\"noreferrer\">רשות ניירות ערך · הוראה למנהלי קרנות ונאמנים בדבר תנאים שיחולו לגבי קרן כספית (2024), עמודים 26, 28, סעיפים 1.1.2-1.1.4 <span class=\"out\">↗</span></a>\n    \n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div>\n    <details class=\"more\"><summary>עוד <bdi dir=\"ltr\" class=\"n\">1</bdi> מקור</summary><div class=\"src\">\n    <a href=\"https://boi.org.il/media/gcmk52bw/447a.pdf#page=1\" target=\"_blank\" rel=\"noreferrer\">בנק ישראל · הוראת ניהול בנקאי תקין 447א: פרסום מידע מרוכז על קרנות כספיות ומק״מ, עמוד 1, סעיף 4 <span class=\"out\">↗</span></a>\n    \n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div></details>\n  </article>","ETF-10":"<article class=\"card\" data-rule=\"ETF-10\">\n    <h3><bdi dir=\"ltr\" class=\"id\">ETF-10</bdi> · נכס המעקב והמטבע</h3>\n    <p class=\"text\">נכס המעקב של קרן מחקה הוא המדד או הסחורה שמדיניות ההשקעות שלה מכוונת אליהם. המנהל חייב לנטרל חשיפה למטבע חוץ שאינה חלק מנכס המעקב, חוץ מחשיפה מזערית לצרכים תפעוליים. לכן בקרן לא מנוטרלת על מדד זר המטבע הוא חלק מנכס המעקב, ובגרסה מנוטרלת מט״ח הוא לא, והיא נושאת קוד חשיפה אחר. כשנכס הייחוס נקוב במטבע חוץ, הדוח השנתי מראה גם את השינוי בשער המטבע.</p>\n    \n    <div class=\"src\">\n    <a href=\"https://www.new.isa.gov.il/images/Fittings/isa/asset_library_pic/al_lobby/al_lobby-62bd445f910eb/mutualfund091024.pdf#page=3\" target=\"_blank\" rel=\"noreferrer\">רשות ניירות ערך · הוראה למנהלי קרנות נאמנות בדבר ניהול ההשקעות בקרן מחקה (עדכון 3, 15.10.2024), עמוד 3, סעיף 4 <span class=\"out\">↗</span></a>\n    \n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div>\n    <details class=\"more\"><summary>עוד <bdi dir=\"ltr\" class=\"n\">2</bdi> מקורות</summary><div class=\"src\">\n    <a href=\"https://www.new.isa.gov.il/images/Fittings/isa/asset_library_pic/al_lobby/al_lobby-62bd445f910eb/Funds_Report2025.pdf#page=20\" target=\"_blank\" rel=\"noreferrer\">רשות ניירות ערך · פעילות קרנות נאמנות בישראל 2025, עמוד 20 <span class=\"out\">↗</span></a>\n    \n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div><div class=\"src\">\n    <a href=\"https://he.wikisource.org/wiki/תקנות_השקעות_משותפות_בנאמנות_(דוח_שנתי_של_קרן)\" target=\"_blank\" rel=\"noreferrer\">ויקיטקסט · , תקנה 18(ב)(10) <span class=\"out\">↗</span></a>\n    \n    <p class=\"checked\">נבדק <bdi dir=\"ltr\" class=\"n\">25.10.2026</bdi></p>\n  </div></details>\n  </article>"},docPanes=["<article class=\"card\"><h3>בנק דיסקונט</h3><p class=\"text\">חוברת תנאים כלליים מלאה</p><dl class=\"figs\"><div><dt>מהד const today=q('#today').innerHTML;
const st={opt:'a',state:'claim',width:'pc'};
function render(){
  qa('[data-opt]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.opt===st.opt));
  qa('[data-state]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.state===st.state));
  qa('[data-width]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.width===st.width));
  q('#stateset').hidden=st.opt==='today';
  const f=q('#frame');f.classList.toggle('phone',st.width==='phone');
  if(st.opt==='today'){q('#why').textContent='אותה טענה בעמוד של היום: החיפוש בעמוד מחפש את כל המשפט כמו שהוא, ולכן לא נמצא כלום, וכל המסך הראשון הוא מסננים.';f.innerHTML=today;return}
  const o=options[st.opt];q('#why').textContent=o.name+': '+o.why;f.innerHTML=o[st.state];wire(f);
}
function wire(f){
  qa('.seg',f).forEach(seg=>{const t=q('#'+seg.dataset.table,f);qa('button',seg).forEach(b=>b.onclick=()=>{qa('button',seg).forEach(x=>x.setAttribute('aria-pressed',x===b));qa('tbody tr',t).forEach(r=>r.hidden=r.dataset.g!==b.dataset.g)})});
  qa('[data-company]',f).forEach(s=>s.onchange=()=>qa('[data-company-table] tbody tr',f).forEach(r=>r.hidden=!!s.value&&r.dataset.co!==s.value));
  qa('[data-to=claim]',f).forEach(a=>a.onclick=e=>{e.preventDefault();st.state='claim';render()});
  qa('a[href="#"]:not([data-to])',f).forEach(a=>a.onclick=e=>e.preventDefault());
  const pane=q('[data-pane]',f);
  qa('[data-open]',f).forEach(b=>b.onclick=()=>{pane.innerHTML=panes[b.dataset.open];mark(f,b)});
  qa('[data-open-doc]',f).forEach(b=>b.onclick=()=>{pane.innerHTML=docPanes[+b.dataset.openDoc];mark(f,b)});
  const first=q('.row:not([hidden])',f);if(first&&pane)mark(f,first);
  qa('[data-product]',f).forEach(s=>s.onchange=()=>{const stat=q('[data-status]',f);if(!stat)return;const name=s.options[s.selectedIndex].text;stat.textContent=s.value?(name+': '+s.value+' חוקים וכללים'):'כל 488 החוקים והכללים, לפי השאלה'});
  qa('.radio input',f).forEach(r=>r.onchange=()=>{qa('[data-shelf]',f).forEach(d=>d.hidden=d.dataset.shelf!==r.value);const box=q('[data-shelf="'+r.value+'"]',f);const stat=q('[data-status]',f);if(stat&&box){stat.textContent=q('h2',box).textContent.replace(' · ',': ')+' חוקים וכללים. מוצגים כאן 4 לדוגמה.';const b=q('.row',box);pane.innerHTML=panes[b.dataset.open];mark(f,b)}});
}
function mark(f,b){qa('.row',f).forEach(x=>x.setAttribute('aria-current',x===b))}
qa('[data-opt]').forEach(b=>b.onclick=()=>{st.opt=b.dataset.opt;render()});
qa('[data-state]').forEach(b=>b.onclick=()=>{st.state=b.dataset.state;render()});
qa('[data-width]').forEach(b=>b.onclick=()=>{st.width=b.dataset.width;render()});
render();</script></body></html>
