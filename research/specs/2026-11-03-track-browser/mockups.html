<title>אב טיפוס: כל המסלולים</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>/* Layout: one option at a time, its page drawn in a stage that is the computer's width or a 390 px phone. Dark only, as the site is. */
:root{
  --palette-neutral-100:oklch(.955 .005 80);--palette-neutral-300:oklch(.82 .008 80);--palette-neutral-600:oklch(.5 .01 80);--palette-neutral-700:oklch(.4 .009 80);--palette-neutral-850:oklch(.27 .007 80);--palette-neutral-900:oklch(.235 .006 80);--palette-neutral-950:oklch(.2 .005 80);--palette-neutral-975:oklch(.17 .004 80);
  --background:var(--palette-neutral-975);--foreground:var(--palette-neutral-100);--card:var(--palette-neutral-950);--popover:var(--palette-neutral-900);--muted-foreground:var(--palette-neutral-300);--border:var(--palette-neutral-850);--input:var(--palette-neutral-600);--frame:var(--palette-neutral-700);--primary:oklch(.82 .081 190);
  --computed:oklch(.73 .168 302);--caution:oklch(.73 .149 70);
  --chart-stocks:oklch(.78 .1 190);--chart-currency:oklch(.88 .12 90);
  --font:Inter,Heebo,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--background)}
body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font);font-size:16px;line-height:1.7;font-variant-numeric:tabular-nums;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--background)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.doc{max-width:1280px;margin:0 auto;padding-block:28px 48px;display:flex;flex-direction:column;gap:20px}
.doc-h{display:flex;flex-direction:column;gap:8px;max-width:62rem}
.common summary{cursor:pointer;color:var(--primary);font-size:14px;min-height:44px;display:flex;align-items:center}
.common ul{margin:4px 0 0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
h1{font-size:28px;line-height:1.25;margin:0;font-weight:700;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted-foreground)}.small{font-size:14px;line-height:1.6}
.n{unicode-bidi:isolate;direction:ltr;white-space:nowrap;display:inline-block}
.n.s{border-bottom:1.5px solid var(--input)}
.n.c{border-bottom:1.5px dotted var(--computed)}
.n.id{font-feature-settings:"zero"}
.clock{width:14px;height:14px;color:var(--caution);flex:none;vertical-align:-2px;margin-inline-end:4px}

/* the switcher: which option, which screen */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--background);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px;padding-block:10px;border-bottom:1px solid var(--border)}
.opt-tabs{display:flex;flex-wrap:wrap;gap:6px}
.opt-tabs button{min-height:44px;padding:6px 16px;border:1px solid var(--border);border-radius:10px;color:var(--muted-foreground);font-size:15px;display:inline-flex;align-items:center;gap:8px}
.opt-tabs button[aria-selected="true"]{color:var(--foreground);border-color:var(--primary);background:var(--popover);font-weight:600}
.view{display:inline-flex;border:1px solid var(--input);border-radius:10px;overflow:hidden}
.view button{min-height:44px;padding:6px 18px;font-size:15px;color:var(--muted-foreground)}
.view button+button{border-inline-start:1px solid var(--input)}
.view button[aria-pressed="true"]{background:var(--primary);color:var(--background);font-weight:600}
.option{display:flex;flex-direction:column;gap:14px}
.opt-p{max-width:62rem}
.tag{display:inline-block;font-size:13px;font-weight:500;padding:0 10px;border-radius:999px;border:1px solid var(--border);color:var(--muted-foreground);white-space:nowrap;line-height:1.7}
.tag.rec{color:var(--primary);border-color:var(--primary);font-weight:600;font-size:12px}
.tag.kind{color:var(--foreground);border-color:var(--input)}
.tags{display:inline-flex;flex-wrap:wrap;gap:6px}
.note{color:var(--caution);font-size:13px}.note::before{content:"✎ "}

/* the stage: the page as drawn, at the computer's width or inside a phone */
.stage{container:stage/inline-size;width:100%}
.stage.phone{max-width:390px;margin-inline:auto;border:1px solid var(--frame);border-radius:28px;padding:10px 0 16px;overflow:hidden}
.site{border:1px solid var(--frame);border-radius:14px;background:var(--background);padding:0 28px 32px;display:flex;flex-direction:column;gap:16px}
.nav{display:flex;flex-wrap:wrap;gap:24px;align-items:center;padding:14px 0;border-bottom:1px solid var(--border);font-size:15px;color:var(--muted-foreground)}
.nav b{color:var(--foreground);font-size:17px}
.nav .on{color:var(--foreground);border-bottom:2px solid var(--primary);padding-bottom:2px}
.tabs{display:flex;gap:28px;border-bottom:1px solid var(--border);font-size:15px;color:var(--muted-foreground);margin-top:8px}
.tabs span{padding:8px 0;margin-bottom:-1px;border-bottom:2px solid transparent;min-height:44px;display:inline-flex;align-items:center}
.tabs .on{color:var(--foreground);font-weight:500;border-color:var(--primary)}
.ph-head{display:flex;flex-direction:column;gap:6px}
.h1{font-size:30px;font-weight:600;line-height:1.3;margin:0}
.lead{max-width:44rem}
.ctl{display:flex;flex-direction:column;gap:6px}
.ctl-l{font-size:13px;color:var(--muted-foreground);font-weight:500}
.ctl-row{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.ix{font-size:14px;padding:6px 12px;border:1px solid var(--border);border-radius:999px;color:var(--muted-foreground);min-height:36px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.ix .cnt{font-size:12px;opacity:.8}
.ix.on{color:var(--background);background:var(--primary);border-color:var(--primary);font-weight:600}
.segs{display:inline-flex;flex-wrap:wrap;border:1px solid var(--input);border-radius:8px;overflow:hidden}
.seg{font-size:14px;padding:8px 14px;min-height:40px;display:inline-flex;align-items:center;color:var(--muted-foreground);border-inline-start:1px solid var(--input);white-space:nowrap}
.seg:first-child{border-inline-start:0}
.seg.on{background:var(--popover);color:var(--foreground);font-weight:600;box-shadow:inset 0 -2px 0 var(--primary)}
.search{border:1px solid var(--input);border-radius:8px;padding:8px 14px;min-height:44px;min-width:min(260px,100%);color:var(--muted-foreground);font-size:14px;display:inline-flex;align-items:center}
.link{color:var(--primary)}
.ph-ctl{display:none}
.field{display:flex;flex-direction:column;gap:4px;flex:1}
.select{border:1px solid var(--input);border-radius:8px;padding:0 12px;min-height:48px;display:flex;align-items:center;justify-content:space-between;font-size:15px}
.select i{font-style:normal;color:var(--muted-foreground)}

/* the computer table, as the company page draws it */
.pc{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:860px;font-size:15px;line-height:1.45}
table.past{min-width:1150px}
table.fixed{table-layout:fixed}
th,td{padding:12px 10px;border-top:1px solid var(--border);text-align:start;vertical-align:middle;font-weight:400}
thead th{font-weight:500;color:var(--muted-foreground);font-size:13px;border-top:0;padding-top:14px;padding-bottom:10px}
th:first-child,td:first-child{padding-inline-start:22px}
.c-id{width:84px}.c-fee{width:190px}.c-exp{width:210px}.c-y{width:200px}.c-a{width:150px}.c-open{width:48px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.nm{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.tname{font-weight:500}
.figs{display:flex;flex-direction:column;gap:4px}
.fig{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.w{font-size:14px;color:var(--muted-foreground)}
.expo{display:inline-flex;align-items:center;gap:10px}
.expo-g{display:grid;grid-template-columns:auto auto;align-items:center;gap:2px 8px;font-size:14px;color:var(--muted-foreground)}
.expo-g .n{color:var(--foreground)}
.lbl{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:50%;display:inline-block}
.sw-stock{background:var(--chart-stocks)}.sw-fx{background:var(--chart-currency)}
.rings{flex:none}
.ring-bg{fill:none;stroke:var(--border);stroke-width:3.5}
.ring-stock{fill:none;stroke:var(--chart-stocks);stroke-width:3.5}
.ring-fx{fill:none;stroke:var(--chart-currency);stroke-width:3.5}
.chev{color:var(--muted-foreground);display:inline-flex;min-width:44px;min-height:44px;align-items:center;justify-content:center}
tr.grp th{background:var(--popover);padding-top:14px;padding-bottom:12px;text-align:start}
.grp-t{font-size:18px;font-weight:600;color:var(--foreground);margin-inline-end:14px}
.grp-l{font-size:14px;color:var(--muted-foreground);font-weight:400}
tr.more td{padding:14px 22px}
.past-note{max-width:48rem}

/* the phone list: one row per track, drawn whenever the stage is narrow (the phone switch, or a real phone) */
.ph{display:none}
@container stage (max-width:760px){
  .site{padding:0 14px 20px;border:0;border-radius:0}
  .nav{gap:14px;font-size:14px}.nav span:not(.on){display:none}
  .h1{font-size:24px}
  .pc,.pc-only{display:none!important}
  .ph-ctl{display:flex;flex-direction:column;gap:10px}
  .ix{min-height:44px}
  .ph{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .pgrp{background:var(--popover);padding:12px 14px;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--border)}
  .pgrp:first-child{border-top:0}
  .prow{display:flex;align-items:center;gap:6px;padding:12px;border-top:1px solid var(--border)}
  .pmain{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
  .pline{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;font-size:15px}
  .pline .figs,.pline>.fig{display:inline-flex}
  .ph .expo-g{display:flex;flex-wrap:nowrap;gap:2px 8px;white-space:nowrap}
  .ph .chev{min-width:20px}
  .ph .pid{margin-inline-start:auto}
  .ph .rings{width:24px;height:24px}
  .ph .more{padding:12px 14px;border-top:1px solid var(--border)}
}
@media (max-width:760px){
  .doc{padding-block:20px 40px}
  h1{font-size:22px}
  .view{display:none}
  .opt-tabs button{font-size:14px;padding:6px 12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* round 2: the company in the row, and the table of companies against kinds */
:root{--chart-fee:oklch(.72 .16 55)}
.co{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.coname{font-weight:600;font-size:16px}
.tsub{font-size:14px;color:var(--muted-foreground)}
.h3{font-size:20px;font-weight:600;line-height:1.35;margin:0}
.list-h{margin-top:8px}

/* round 3: the controls are real */
[hidden]{display:none!important}
.ix[aria-pressed="true"]{color:var(--background);background:var(--primary);border-color:var(--primary);font-weight:600}
.ix:hover,.seg:hover:not(:disabled){color:var(--foreground)}
.ix[aria-pressed="true"]:hover{color:var(--background)}
.seg[aria-pressed="true"]{background:var(--popover);color:var(--foreground);font-weight:600;box-shadow:inset 0 -2px 0 var(--primary)}
.seg:disabled{opacity:.4;cursor:not-allowed}
.ix:focus-visible,.seg:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.search-f{display:flex;flex-direction:column;gap:6px}
input[type=search],select{font:inherit;font-size:15px;color:var(--foreground);background:var(--background);border:1px solid var(--input);border-radius:8px;padding:0 12px;min-height:44px;min-width:min(280px,100%)}
select{min-height:48px;width:100%}
.ph-ctl input[type=search]{min-height:48px;width:100%}
.empty{padding:28px 22px;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--muted-foreground)}
.ctl .segs,.ctl .chips{align-self:flex-start}
</style>

<script>// The prototype's page, drawn in the browser from DATA (written by gen.mjs). Plain script, no library.
(() => {
  const CO = DATA.companies;
  const FEE_YEAR = DATA.feeYear;
  const he = new Intl.Collator("he");
  const R = (a) => ({ id: a[0], co: CO[a[1]], name: a[2], sub: a[3], kind: a[4], fee: a[5], dep: a[6], stock: a[7], fx: a[8], assets: a[9], y3: a[10], y5: a[11], open: a[12] });
  const median = (xs) => { const s = xs.filter((x) => x != null).sort((a, b) => a - b); return s.length ? s[Math.floor(s.length / 2)] : 0; };

  const products = DATA.products.map((p) => {
    const rows = p.rows.map(R);
    const hasKinds = rows.some((r) => r.sub);
    const bySub = new Map();
    for (const r of rows) if (r.sub) (bySub.get(r.sub) ?? bySub.set(r.sub, []).get(r.sub)).push(r);
    // kinds from the highest stock share to the lowest (median over the kind's tracks), ties by size
    const kinds = [...bySub.entries()].map(([sub, list]) => ({ sub, kind: list[0].kind, count: list.length, stock: median(list.map((r) => r.stock)) })).sort((a, b) => b.stock - a.stock || b.count - a.count);
    const co = new Map();
    for (const r of rows) { const s = co.get(r.co) ?? { count: 0, assets: 0 }; s.count++; s.assets += r.assets ?? 0; co.set(r.co, s); }
    return { ...p, rows, hasKinds, kinds, co, coOrder: [...co.entries()].sort((a, b) => b[1].assets - a[1].assets).map(([c]) => c) };
  });

  const st = { p: products.findIndex((p) => p.id === "kupat-gemel-lehashkaa"), group: "company", kind: "", sort: "fee", q: "" };

  // ---- formatting, as the site draws numbers ----
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const n = (s, cls = "") => `<span class="n ${cls}">${s}</span>`;
  const pct2 = (v) => (v === 0 ? "0%" : `${v.toFixed(2)}%`);
  const signed = (v) => (v < 0 ? `−${Math.abs(v).toFixed(2)}%` : `${v.toFixed(2)}%`);
  const clock = `<svg class="clock" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 4.6V8l2.3 1.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`;
  const sourced = (s, stale = false) => `${stale ? clock : ""}${n(s, "s")}`;
  const computedNum = (s) => `<span class="fig">${clock}${n(s, "c")}</span>`;
  const bigNum = (m, cls) => (m >= 1000 ? `${n((m / 1000).toLocaleString("he-IL", { maximumFractionDigits: 1 }), cls)} מיליארד ₪` : `${n(Math.round(m).toLocaleString("he-IL"), cls)} מיליון ₪`);
  const money = (m) => (m == null ? `<span class="muted small">לא דווח</span>` : `<span class="fig">${clock}${bigNum(m, "s")}</span>`);
  const isNew = (r) => !!r.open && Number(r.open.slice(0, 4)) >= FEE_YEAR;
  const younger = (r, years) => !!r.open && r.open > `${Number(DATA.period.slice(0, 4)) - years}-${DATA.period.slice(5)}-31`;

  function rings(stock, fx, size = 30) {
    const c = size / 2;
    const ring = (rad, frac, cls) => {
      const len = 2 * Math.PI * rad;
      const f = Math.max(0, Math.min(1, (frac ?? 0) / 100));
      return `<circle cx="${c}" cy="${c}" r="${rad}" class="ring-bg"/><circle cx="${c}" cy="${c}" r="${rad}" class="${cls}" stroke-dasharray="${(f * len).toFixed(2)} ${len.toFixed(2)}" transform="rotate(-90 ${c} ${c})"/>`;
    };
    return `<svg class="rings" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">${ring(c - 3, stock, "ring-stock")}${ring(c - 8, fx, "ring-fx")}</svg>`;
  }
  const feeFigs = (r) =>
    r.fee == null
      ? `<span class="muted small">עוד לא דווח</span>`
      : `<span class="fig">${sourced(pct2(r.fee))}<span class="w">מהחיסכון</span></span><span class="fig">${sourced(pct2(r.dep ?? 0))}<span class="w">מההפקדות</span></span>`;
  const exposureCell = (r) =>
    r.stock == null
      ? `<span class="muted small">לא דווח</span>`
      : `<span class="expo">${rings(r.stock, r.fx)}<span class="expo-g"><span class="lbl"><i class="sw sw-stock"></i>מניות</span>${computedNum(`${Math.round(r.stock)}%`)}<span class="lbl"><i class="sw sw-fx"></i>מט״ח</span>${r.fx == null ? `<span class="muted small">לא דווח</span>` : computedNum(`${Math.round(r.fx)}%`)}</span></span>`;
  const yieldOne = (v, years, r) =>
    `<span class="fig">${v == null ? `<span class="muted small">${younger(r, years) ? `פחות מ־${years} שנים` : "לא דווח"}</span>` : `${sourced(signed(v), true)}<span class="w">${years} שנים</span>`}</span>`;
  const yieldCell = (r) => yieldOne(r.y3, 3, r) + yieldOne(r.y5, 5, r);
  const chev = `<span class="chev" aria-hidden="true"><svg viewBox="0 0 16 16" width="16" height="16"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`;
  const tags = (r, withKind) => {
    const t = [];
    if (isNew(r)) t.push(`<span class="tag">חדש</span>`);
    if (withKind && r.sub) t.push(`<span class="tag kind">${esc(r.sub)}</span>`);
    return t.length ? `<span class="tags">${t.join("")}</span>` : "";
  };
  const count = (k) => (k === 1 ? "מסלול אחד" : `${k} מסלולים`);
  const feeRange = (list) => {
    const fees = list.map((r) => r.fee).filter((v) => v != null);
    return fees.length ? `דמי ניהול מהחיסכון: מ־${n(pct2(Math.min(...fees)), "s")} עד ${n(pct2(Math.max(...fees)), "s")}` : "דמי ניהול עוד לא דווחו";
  };

  // ---- the controls, drawn once per product ----
  const SORTS = [
    { id: "fee", label: "דמי ניהול מהחיסכון", words: "דמי הניהול מהחיסכון, מהזול ליקר" },
    { id: "dep", label: "דמי ניהול מההפקדות", words: "דמי הניהול מההפקדות, מהזול ליקר" },
    { id: "stock", label: "חשיפה למניות", words: "החשיפה למניות, מהגבוהה לנמוכה" },
    { id: "company", label: "שם החברה", words: "שם החברה" },
  ];
  const site = document.getElementById("site");
  site.innerHTML = `
  <nav class="nav"><b>מקור</b><span>מדריכים</span><span>חוקים וכללים</span><span>שאלות</span><span class="on">חברות ומסלולים</span><span>השקעה במדד</span></nav>
  <div class="tabs"><span>לפי חברה</span><span class="on">לפי מוצר</span></div>
  <header class="ph-head">
    <h2 class="h1">כל המסלולים בכל החברות</h2>
    <p class="muted lead">בוחרים מוצר ורואים את המסלולים של כל החברות שמנהלות אותו. דמי הניהול הם הממוצע שנגבה בפועל ב־${n(String(FEE_YEAR))}; החשיפה, התשואה והנכסים נכונים לסוף ספטמבר ${n("2026")}. מנתוני רשות שוק ההון.</p>
  </header>
  <div class="ctl"><span class="ctl-l">מוצר</span><div class="chips" id="prod" role="group" aria-label="מוצר"></div></div>
  <p class="small muted" id="countline"></p>
  <div class="ctl-row">
    <div class="ctl"><span class="ctl-l">קיבוץ לפי</span><div class="segs" id="group" role="group" aria-label="קיבוץ לפי"></div></div>
    <label class="search-f pc-only"><span class="ctl-l">חיפוש</span><input id="q" type="search" placeholder="שם המסלול או החברה" autocomplete="off"></label>
  </div>
  <div class="ctl pc-only" id="kinds-pc"><span class="ctl-l">במה הכסף מושקע</span><div class="chips" id="kinds" role="group" aria-label="במה הכסף מושקע"></div></div>
  <div class="ctl pc-only"><span class="ctl-l">מיון בתוך כל קבוצה</span><div class="segs" id="sort" role="group" aria-label="מיון"></div></div>
  <div class="ph-ctl">
    <label class="field"><span class="ctl-l">חיפוש</span><input id="q2" type="search" placeholder="שם המסלול או החברה" autocomplete="off"></label>
    <label class="field" id="kinds-ph"><span class="ctl-l">במה הכסף מושקע</span><select id="kindSel"></select></label>
    <label class="field"><span class="ctl-l">מיון בתוך כל קבוצה</span><select id="sortSel">${SORTS.map((s) => `<option value="${s.id}">${s.label}</option>`).join("")}</select></label>
  </div>
  <p class="small muted" id="order"></p>
  <div id="list"></div>
  <p class="small muted past-note">התשואה היא תשואת עבר כמו שהרשות מפרסמת אותה: לפני דמי הניהול ולפני מס. היא לא אומרת מה יקרה בהמשך, ולכן אין מיון לפיה.</p>`;
  const $ = (id) => document.getElementById(id);

  function drawControls() {
    const p = products[st.p];
    $("prod").innerHTML = products.map((x, i) => `<button type="button" class="ix" data-p="${i}" aria-pressed="${i === st.p}">${x.name} <span class="cnt">${x.rows.length}</span></button>`).join("");
    if (!p.hasKinds && st.group === "kind") st.group = "company";
    $("group").innerHTML = [["company", "חברה"], ["kind", "במה הכסף מושקע"]].map(([id, label]) => `<button type="button" class="seg" data-group="${id}" aria-pressed="${st.group === id}"${id === "kind" && !p.hasKinds ? " disabled" : ""}>${label}</button>`).join("");
    $("kinds-pc").hidden = $("kinds-ph").hidden = !p.hasKinds;
    if (p.hasKinds) {
      $("kinds").innerHTML = [`<button type="button" class="ix" data-kind="" aria-pressed="${st.kind === ""}">הכול <span class="cnt">${p.rows.length}</span></button>`, ...p.kinds.map((k) => `<button type="button" class="ix" data-kind="${esc(k.sub)}" aria-pressed="${st.kind === k.sub}">${esc(k.sub)} <span class="cnt">${k.count}</span></button>`)].join("");
      $("kindSel").innerHTML = [`<option value="">הכול (${p.rows.length})</option>`, ...p.kinds.map((k) => `<option value="${esc(k.sub)}"${st.kind === k.sub ? " selected" : ""}>${esc(k.sub)} (${k.count})</option>`)].join("");
    }
    $("sort").innerHTML = SORTS.map((s) => `<button type="button" class="seg" data-sort="${s.id}" aria-pressed="${st.sort === s.id}">${s.label}</button>`).join("");
    $("sortSel").value = st.sort;
  }

  // ---- the list ----
  const sorters = {
    fee: (a, b) => (a.fee ?? 99) - (b.fee ?? 99) || (a.dep ?? 99) - (b.dep ?? 99) || he.compare(a.co, b.co),
    dep: (a, b) => (a.dep ?? 99) - (b.dep ?? 99) || (a.fee ?? 99) - (b.fee ?? 99) || he.compare(a.co, b.co),
    stock: (a, b) => (b.stock ?? -1) - (a.stock ?? -1) || (a.fee ?? 99) - (b.fee ?? 99),
    company: (a, b) => he.compare(a.co, b.co) || he.compare(a.name, b.name),
  };

  function drawList() {
    const p = products[st.p];
    const q = st.q.trim();
    const rows = p.rows.filter((r) => (!st.kind || r.sub === st.kind) && (!q || r.name.includes(q) || r.co.includes(q))).sort(sorters[st.sort]);
    const byCo = st.group === "company";
    let groups;
    if (byCo) {
      groups = p.coOrder.map((c) => {
        const list = rows.filter((r) => r.co === c);
        const s = p.co.get(c);
        return { title: c, line: `${count(list.length)}${list.length < s.count ? ` מתוך ${s.count}` : ""} · נכסים ${bigNum(s.assets, "c")} · ${feeRange(list)}`, list };
      });
    } else {
      groups = p.kinds.map((k) => {
        const list = rows.filter((r) => r.sub === k.sub);
        return { title: k.sub, line: `${esc(k.kind)} · ${count(list.length)} · ${feeRange(list)}`, list };
      });
    }
    groups = groups.filter((g) => g.list.length);
    const shownCos = new Set(rows.map((r) => r.co)).size;
    $("countline").innerHTML = `${n(String(rows.length))} מסלולים של ${n(String(shownCos))} חברות${rows.length < p.rows.length ? ` (מתוך ${n(String(p.rows.length))})` : ""}. <a class="link">מה זה ${p.name}</a>${p.hasKinds ? "" : ` · הרשות לא מסווגת את המסלולים של המוצר הזה לפי במה הכסף מושקע, ולכן אין קיבוץ כזה.`}`;
    const sortWords = SORTS.find((s) => s.id === st.sort).words;
    $("order").textContent = byCo ? `החברות מסודרות מהגדולה לקטנה בנכסים ב${p.name}; בתוך כל חברה לפי ${sortWords}.` : `הקבוצות מסודרות מהחשיפה למניות הגבוהה לנמוכה; בתוך כל קבוצה לפי ${sortWords}.`;
    if (!rows.length) {
      $("list").innerHTML = `<div class="empty">אין מסלולים שמתאימים לחיפוש "${esc(q)}".</div>`;
      return;
    }
    const coLine = (c) => { const s = p.co.get(c); return `${count(s.count)} · ${bigNum(s.assets, "c")} ב${p.name}`; };
    const nameCell = (r) =>
      byCo
        ? `<span class="nm"><a class="tname">${esc(r.name)}</a>${tags(r, true)}</span>`
        : `<span class="nm"><span class="co"><a class="coname">${esc(r.co)}</a><span class="w">${coLine(r.co)}</span></span><span class="tsub">${esc(r.name)}</span>${tags(r, false)}</span>`;
    const head = `<thead><tr><th class="c-name">${byCo ? "שם המסלול, כמו שהחברה כותבת אותו" : "החברה, ושם המסלול כמו שהיא כותבת אותו"}</th><th class="c-id">קופה</th><th class="c-fee">דמי ניהול, ממוצע ${FEE_YEAR}</th><th class="c-exp">חשיפה בסוף ספטמבר 2026</th><th class="c-y">תשואה שנתית ממוצעת, לפני דמי ניהול</th><th class="c-a">נכסים בסוף ספטמבר 2026</th><th class="c-open"><span class="sr">פתיחה</span></th></tr></thead>`;
    const tr = (r) => `<tr><td>${nameCell(r)}</td><td>${n(r.id, "id")}</td><td><span class="figs">${feeFigs(r)}</span></td><td>${exposureCell(r)}</td><td><span class="figs">${yieldCell(r)}</span></td><td>${money(r.assets)}</td><td>${chev}</td></tr>`;
    const table = `<div class="pc"><table class="fixed past">${head}${groups.map((g) => `<tbody><tr class="grp"><th colspan="7" scope="rowgroup"><span class="grp-t">${esc(g.title)}</span><span class="grp-l">${g.line}</span></th></tr>${g.list.map(tr).join("")}</tbody>`).join("")}</table></div>`;
    const prow = (r) => `<div class="prow"><div class="pmain">${nameCell(r)}<span class="pline">${feeFigs(r)}<span class="fig pid"><span class="w">קופה</span>${n(r.id, "id")}</span></span><span class="pline">${exposureCell(r)}</span><span class="pline">${yieldCell(r)}</span><span class="pline"><span class="w">נכסים</span>${money(r.assets)}</span></div>${chev}</div>`;
    const phone = `<div class="ph">${groups.map((g) => `<div class="pgrp"><span class="grp-t">${esc(g.title)}</span><span class="grp-l">${g.line}</span></div>${g.list.map(prow).join("")}`).join("")}</div>`;
    $("list").innerHTML = table + phone;
  }

  // ---- what each control does ----
  site.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b || b.disabled) return;
    if (b.dataset.p != null) { st.p = Number(b.dataset.p); st.kind = ""; drawControls(); drawList(); }
    else if (b.dataset.group) { st.group = b.dataset.group; drawControls(); drawList(); }
    else if (b.dataset.kind != null) { st.kind = b.dataset.kind; drawControls(); drawList(); }
    else if (b.dataset.sort) { st.sort = b.dataset.sort; drawControls(); drawList(); }
  });
  $("kindSel").addEventListener("change", (e) => { st.kind = e.target.value; drawControls(); drawList(); });
  $("sortSel").addEventListener("change", (e) => { st.sort = e.target.value; drawControls(); drawList(); });
  for (const id of ["q", "q2"]) $(id).addEventListener("input", (e) => { st.q = e.target.value; $(id === "q" ? "q2" : "q").value = st.q; drawList(); });

  const stage = document.getElementById("stage");
  for (const b of document.querySelectorAll("[data-view]")) b.addEventListener("click", () => {
    for (const x of document.querySelectorAll("[data-view]")) x.setAttribute("aria-pressed", String(x === b));
    stage.classList.toggle("phone", b.dataset.view === "phone");
  });

  drawControls();
  drawList();
})();
</script>
