name: ci

# Branches other than main are checked once, by the pull_request run; a push to a branch would run the same
# checks a second time on the same commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Two jobs side by side, the tests in one and the site build with its browser checks in the other, and the deploy after both
# (2026-11-08: one job running everything in turn took about eight and a half minutes from a push to the live site).
#
# Both check out the tree without research/user-lab: screenshots and reports, 111 of the tree's 147 MB, that no check reads.
# A check that comes to read a file there fails for want of it: take the folder out of the two lists below.
jobs:
  # The typecheck, the tests and the data check.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/research/user-lab/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate

  # The site build and the checks that open it in a browser; on main, the site for the deploy. (The copy to run offline is offline.yml, run by hand.)
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/research/user-lab/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Playwright's headless Chrome, at the version package.json pins, installs while the site builds (about 13 s, most of it apt);
      # "Wait for Chrome" below prints its log and fails the run if it failed. The system packages come from Ubuntu's archive: when
      # it does not answer within 2 minutes the install goes on with the browser alone, on the packages the runner already has
      # (a library Chrome then lacks fails the checks when they start it).
      - name: Install Chrome for the browser checks (in the background)
        run: |
          nohup sh -c '(timeout 120 npx playwright install --with-deps --only-shell chromium || { echo "the install with system packages failed or ran over 2 minutes: installing the browser alone"; npx playwright install --only-shell chromium; }) > "$RUNNER_TEMP/chrome.log" 2>&1; echo $? > "$RUNNER_TEMP/chrome.done"' > /dev/null 2>&1 &
      - run: npm run build
      # An install still running after 5 minutes is given up on with its log printed, so the run says where it stood.
      - name: Wait for Chrome
        timeout-minutes: 6
        run: |
          for i in $(seq 1 300); do [ -f "$RUNNER_TEMP/chrome.done" ] && break; sleep 1; done
          cat "$RUNNER_TEMP/chrome.log"
          [ -f "$RUNNER_TEMP/chrome.done" ] || { echo "Chrome's install did not finish in 5 minutes"; ps -eo pid,etimes,args | grep -i "playwright\|apt\|dpkg" | grep -v grep; exit 1; }
          exit "$(cat "$RUNNER_TEMP/chrome.done")"
      # The chart check (site/scripts/chart-check/): headless Chrome and python3 with only its standard library, which ubuntu-latest has.
      # A chart that overlaps, cuts off or shrinks its text, or draws bars off the zero line or in more than six colours, fails the run,
      # and the site doesn't update.
      - run: npm run chart-check
      # The layout check (site/scripts/layout-check.mjs): every page at 1440, 390 and 320 px. A page wider than the screen, words that run out
      # of their card or cell, a "?" on a line of its own, or a warning a small phone's sheet hides below its fold fails the run.
      - run: npm run layout-check
      - if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/build/client

  # GitHub Pages (docs/architecture.md section 6). Only main is deployed, and only after every check passed.
  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [test, check]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
