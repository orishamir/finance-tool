name: ci

# Branches other than main are checked once, by the pull_request run; a push to a branch would run the same
# checks a second time on the same commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate
      - run: npm run build
      - if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/build/client
      # The same site as a .tar.gz to run offline (docs/architecture.md section 6): extract it, run `python3 -m http.server`
      # in the folder, open http://localhost:8000/. The pages sit under finance-tool/ (the basename); index.html at the top
      # sends the browser there.
      - if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          mkdir -p offline/finance-tool
          cp -r site/build/client/. offline/finance-tool/
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=finance-tool/"><a href="finance-tool/">finance-tool</a>\n' > offline/index.html
          printf 'Run: python3 -m http.server   (in this folder)\nOpen: http://localhost:8000/\nBuilt from %s on %s.\n' "$GITHUB_SHA" "$(date -u +%F)" > offline/README.txt
          tar -czf finance-tool-site.tar.gz -C offline .
      - if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: finance-tool-site
          path: finance-tool-site.tar.gz
          # already gzipped; about 120 MB per run, so kept two weeks
          compression-level: 0
          retention-days: 14

  # GitHub Pages (docs/architecture.md section 6). Only main is deployed, and only after every check passed.
  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
