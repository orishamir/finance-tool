# Dead-man check for refresh.yml and refresh-rates.yml (docs/architecture.md sections 3.3 and 6).
#
# GitHub disables scheduled workflows on a public repository after a stretch with no repository
# activity. If that happens to either (or a refresh fails for days), no workflow reports it,
# so this one runs weekly and fails when one of them had no successful run in the last 3 days:
# GitHub mails the owner about a failed scheduled run. (It opened an issue until the repository
# stopped using issues, 2026-11-08.) It can be disabled for the same reason; the fallback is then
# the home machine (gap H3): run `npm run refresh -- cma` there and look at the Actions tab now and then.
name: refresh-watchdog

on:
  schedule:
    - cron: "15 6 * * 1"
  workflow_dispatch:

permissions:
  actions: read

jobs:
  watchdog:
    strategy:
      fail-fast: false
      matrix:
        workflow: [refresh.yml, refresh-rates.yml]
    runs-on: ubuntu-latest
    env:
      WORKFLOW: ${{ matrix.workflow }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          since=$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)
          recent=$(gh run list --workflow "$WORKFLOW" --status success --created ">=${since}" --json databaseId --jq 'length')
          last=$(gh run list --workflow "$WORKFLOW" --status success --limit 1 --json createdAt --jq '.[0].createdAt[:10] // "never"')
          if [ "$recent" -gt 0 ]; then
            echo "A refresh succeeded in the last 3 days (last success ${last})."
            exit 0
          fi
          echo "::error title=${WORKFLOW} has not succeeded since ${last}::No successful run of ${WORKFLOW} since ${last} (checked $(date -u +%F)). Check the Actions tab; GitHub disables scheduled workflows on inactive public repositories, so re-enable it or run \`npm run refresh\` on the home machine."
          exit 1
